<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>화장수리 · 털 추출 검증 준비</title><style>*{box-sizing:border-box}body{margin:0;background:#f1faff;font:15px -apple-system,BlinkMacSystemFont,sans-serif;color:#23465a}header{background:white;padding:16px;font-weight:750}main{padding:15px;max-width:650px;margin:auto}button,.file{display:inline-block;padding:13px;border:1px solid #9ed4ec;border-radius:12px;background:white;color:#17658a;font-weight:700}input[type=file]{display:none}canvas{display:block;width:100%;background:#dce9ef;border-radius:12px;touch-action:none}p{line-height:1.5;font-size:13px;color:#526f7e}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls label{font-size:13px}.controls input{width:100%}#state{font-size:13px;padding:12px 0}#save{width:100%;margin-top:10px}small{display:block;color:#526f7e;margin-top:8px}</style></head><body><header>화장수리 · 원본 눈썹 검증 준비 01</header><main><p><b>이 페이지는 AI 추출기가 아닙니다.</b> 아이폰에서 원본 화질의 눈썹 영역을 준비해 별도 모델과 비교하기 위한 실험 도구입니다. 기존 앱과 별도로 작동합니다.</p><label class="file" for="photo">사진 불러오기</label><input id="photo" type="file" accept="image/*"><p>사진 위에서 손가락으로 눈썹 중심을 선택하세요. 아래 가로·세로 크기를 조절해 눈썹만 잘라냅니다. 원본 픽셀로 저장합니다.</p><canvas id="view" width="900" height="650"></canvas><div class="controls"><label>가로 범위 <input id="w" type="range" min="8" max="80" value="35"></label><label>세로 범위 <input id="h" type="range" min="5" max="55" value="20"></label></div><div id="state">사진을 선택해 주세요.</div><button id="save" disabled>눈썹 원본 해상도 PNG 저장</button><small>얼굴 전체 사진을 외부 서버로 전송하지 않습니다. 선택한 사진은 이 브라우저 안에서만 처리합니다.</small></main><script>const $=id=>document.getElementById(id),c=$('view'),ctx=c.getContext('2d');let img=null,cx=.5,cy=.5,iw=0,ih=0;function draw(){const W=c.width,H=c.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#dce9ef';ctx.fillRect(0,0,W,H);if(!img)return;const s=Math.min(W/iw,H/ih),dw=iw*s,dh=ih*s,ox=(W-dw)/2,oy=(H-dh)/2;ctx.drawImage(img,ox,oy,dw,dh);const rw=dw*Number($('w').value)/100,rh=dh*Number($('h').value)/100,x=ox+cx*dw-rw/2,y=oy+cy*dh-rh/2;ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(ox,oy,dw,dh);ctx.drawImage(img,Math.max(0,(cx-Number($('w').value)/200)*iw),Math.max(0,(cy-Number($('h').value)/200)*ih),Math.min(iw,Number($('w').value)/100*iw),Math.min(ih,Number($('h').value)/100*ih),x,y,rw,rh);ctx.strokeStyle='#ffdb56';ctx.lineWidth=4;ctx.strokeRect(x,y,rw,rh);$('state').textContent='원본 '+iw+'×'+ih+'px · 선택 영역 약 '+Math.round(iw*Number($('w').value)/100)+'×'+Math.round(ih*Number($('h').value)/100)+'px'}$('photo').onchange=async e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);const im=new Image();im.onload=()=>{img=im;iw=im.naturalWidth;ih=im.naturalHeight;cx=.5;cy=.5;draw();$('save').disabled=false;URL.revokeObjectURL(url)};im.onerror=()=>{$('state').textContent='사진을 열지 못했습니다.';URL.revokeObjectURL(url)};im.src=url};c.addEventListener('pointerdown',e=>{if(!img)return;const b=c.getBoundingClientRect(),x=(e.clientX-b.left)*c.width/b.width,y=(e.clientY-b.top)*c.height/b.height,s=Math.min(c.width/iw,c.height/ih),dw=iw*s,dh=ih*s;cx=Math.max(0,Math.min(1,(x-(c.width-dw)/2)/dw));cy=Math.max(0,Math.min(1,(y-(c.height-dh)/2)/dh));draw()});for(const id of ['w','h'])$(id).oninput=draw;$('save').onclick=()=>{if(!img)return;const w=Math.max(1,Math.round(iw*Number($('w').value)/100)),h=Math.max(1,Math.round(ih*Number($('h').value)/100));const x=Math.max(0,Math.min(iw-w,Math.round(cx*iw-w/2))),y=Math.max(0,Math.min(ih-h,Math.round(cy*ih-h/2)));const out=document.createElement('canvas');out.width=w;out.height=h;out.getContext('2d').drawImage(img,x,y,w,h,0,0,w,h);out.toBlob(blob=>{if(!blob){$('state').textContent='PNG 생성 실패';return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hwajang-eyebrow-original-roi.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),15000)},'image/png')};draw();</script></body></html>
