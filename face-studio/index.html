<script>

$('designs').replaceChildren(...Array.from({length:20},(_,i)=>{let n=i+1,b=document.createElement('button');b.className='design'+(state.designs[state.category]===n?' on':'');b.innerHTML='<span class="shape">'+icons[state.category]+'</span><small>'+state.category+' '+n+'</small>';b.onclick=()=>{state.designs[state.category]=n;render();};return b}));
const a=adj();$('adjustPanel').hidden=!state.designs[state.category];$('adjustTitle').textContent=state.category+' 위치 · 크기';$('pos').textContent='';$('sizeval').textContent=a.size+'%';$('mainImg').hidden=!state.photos.length;$('empty').hidden=!!state.photos.length;if(state.photos.length){$('mainImg').src=state.photos[state.active].url;$('photoLabel').textContent='사진 '+(state.active+1)+' / '+state.photos.length}else $('photoLabel').textContent='사진 미등록';
$('thumbs').replaceChildren(...state.photos.map((p,i)=>{let b=document.createElement('button');b.className='thumb'+(i===state.active?' active':'');b.innerHTML='<img alt="사진 '+(i+1)+'"><span>'+(i+1)+'</span>';b.querySelector('img').src=p.url;b.onclick=()=>{state.active=i;render()};return b}),$('addPhoto'))}
function add(files){for(const file of files){if(!file.type.startsWith('image/'))continue;state.photos.push({name:file.name,url:URL.createObjectURL(file)})}if(state.photos.length)state.active=state.photos.length-1;render()}
$('gallery').onclick=()=> $('galleryInput').click();$('camera').onclick=()=> $('cameraInput').click();$('addPhoto').onclick=()=> $('galleryInput').click();for(const id of ['galleryInput','cameraInput'])$(id).onchange=e=>{add([...e.target.files]);e.target.value=''};
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let a=adj(),d=b.dataset.move;a.x+=(d==='right'?1:d==='left'?-1:0);a.y+=(d==='down'?1:d==='up'?-1:0);render()});$('smaller').onclick=()=>{adj().size=Math.max(50,adj().size-1);render()};$('bigger').onclick=()=>{adj().size=Math.min(150,adj().size+1);render()};$('reset').onclick=()=>{state.adjustments[state.category]={x:0,y:0,size:100};render()};
$('lockToggle').onclick=()=>{let m=$('lockMenu');m.hidden=!m.hidden;$('lockToggle').setAttribute('aria-expanded',String(!m.hidden))};$('saveImage').onclick=()=>alert('실제 얼굴 합성 및 결과 사진 저장 기능은 아직 연결되지 않았습니다. 원본 사진을 수정 결과로 잘못 저장하지 않도록 저장을 보류합니다.');render();
