<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FACE STUDIO · 시술 부위 보존</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;color:#243343;background:#eef6fa}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;min-height:100dvh;background:#f8fbfd;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 3px 9px}h1{font-size:18px;margin:0;letter-spacing:1px}.sub{font-size:11px;color:#7b93a4;margin-top:3px}.actions{display:flex;gap:5px;flex-shrink:0}.actions .small{padding:9px 7px;font-size:11px}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:2px solid #4b9ed3}.small{background:#e1f0f8;border-radius:10px;padding:10px 11px;color:#286184;font-size:12px}.primary{background:#65b4e3;color:#fff}.photo{height:min(46vh,440px);min-height:250px;background:linear-gradient(140deg,#e6f2f8,#f8fbfd);border:1px solid #d6e6ee;border-radius:20px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.photo img{max-width:100%;max-height:100%;object-fit:contain}.empty{text-align:center;color:#7b99ab;font-size:13px;line-height:2}.empty .big{font-size:36px}.photo-label{position:absolute;bottom:8px;right:10px;background:#ffffffdc;padding:6px 10px;border-radius:20px;font-size:11px}.strip{position:absolute;bottom:8px;left:8px;right:100px;display:flex;gap:5px;overflow-x:auto;padding:2px;z-index:2}.photo-label{z-index:2}.thumb{width:45px;height:45px;flex:none;border-radius:11px;border:2px solid transparent;background:#e6eff4;overflow:hidden;position:relative}.thumb.active{border-color:#56aee0}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{position:absolute;bottom:0;left:0;right:0;background:#0008;color:white;font-size:10px}.section{margin:8px 0 5px;font-weight:700;font-size:13px}.hint{font-size:11px;color:#8096a5;font-weight:400}.preserve,.tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:3px 0}.chip{flex:none;border-radius:20px;padding:9px 14px;background:#e7f1f7;color:#597b8e;font-size:12px}.chip.on{background:#78bce4;color:#fff}.tabs{gap:9px}.tab{flex:none;background:transparent;border-bottom:3px solid transparent;padding:11px 5px 8px;color:#7a94a4;font-size:13px}.tab.on{border-color:#67b6e3;color:#2b7cae;font-weight:700}.designs{display:flex;gap:10px;overflow-x:auto;padding:5px 0 7px;scroll-snap-type:x mandatory}.design{flex:none;width:74px;height:72px;border:2px solid #e2ecf1;border-radius:13px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;scroll-snap-align:start}.design.on{border-color:#64b3df;background:#eff9ff}.design .shape{font-size:25px;color:#79a7c3}.design small{font-size:11px;color:#57758b}.adjust[hidden]{display:none}.adjust{background:#edf6fb;border-radius:15px;padding:13px}.adjusthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.adjusthead b{font-size:13px}.reset{font-size:11px;background:#fff;color:#5986a3;padding:7px 10px;border-radius:8px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.control{background:white;border-radius:11px;padding:10px;text-align:center}.control label{font-size:11px;color:#7993a5;display:block;margin-bottom:8px}.arrows{display:grid;grid-template-columns:repeat(3,32px);justify-content:center;gap:3px}.arrows button{height:30px;border-radius:7px;background:#dceefa;color:#427b9e}.arrows .val{font-size:10px;align-content:center;color:#668397}.sizeval{font-size:17px;color:#468fbb;font-weight:700;margin:10px 0}.sizebuttons{display:flex;gap:6px;justify-content:center}.sizebuttons button{background:#dceefa;color:#427b9e;padding:8px 15px;border-radius:8px}.notice{margin:12px 0 16px;color:#7893a4;font-size:11px;line-height:1.6}.bottom{display:flex;gap:8px;padding-bottom:10px}.bottom button{flex:1;padding:13px;border-radius:12px;font-size:13px}.off{opacity:.45}input[type=file]{display:none}</style></head><body><main class="app"><header><div><h1>FACE STUDIO</h1><div class="sub">시술 부위 보존 · 인물 디자인</div></div><div class="actions"><button class="small" id="camera">촬영</button><button class="small primary" id="gallery">불러오기</button><button class="small" id="saveImage">저장</button></div></header>
<section class="photo" id="photo"><div class="photo-label" id="photoLabel">사진 미등록</div><div class="strip" id="thumbs"><button class="thumb" id="addPhoto" aria-label="사진 추가">＋</button></div><div class="empty" id="empty"><div class="big">▧</div>시술 전·후 사진을 불러와 주세요<br>여러 장을 한 번에 선택할 수 있어요</div><img id="mainImg" hidden alt="선택된 고객 사진"></section>
<div class="section">🔒 원본으로 보존할 부위 <span class="hint">· 여러 개 선택 가능</span></div><div class="preserve" id="preserve"></div>
<div class="section" aria-label="변경할 디자인">🪄</div><nav class="tabs" id="tabs"></nav><div class="designs" id="designs"></div>
<section class="adjust" id="adjustPanel" hidden><div class="adjusthead"><b id="adjustTitle">얼굴형 위치 · 크기</b><button class="reset" id="reset">초기화</button></div><div class="controls"><div class="control"><label>위치 미세 조정</label><div class="arrows"><span></span><button data-move="up">↑</button><span></span><button data-move="left">←</button><span class="val" id="pos">0, 0</span><button data-move="right">→</button><span></span><button data-move="down">↓</button><span></span></div></div><div class="control"><label>크기 조절</label><div class="sizeval" id="sizeval">100%</div><div class="sizebuttons"><button id="smaller">−</button><button id="bigger">＋</button></div></div></div></section>
<div class="notice">화면 구성 테스트 버전입니다. 디자인 선택 시 실제 얼굴 합성은 아직 적용되지 않습니다. 원본 보존 마스킹과 합성 사진 저장도 추후 연결이 필요합니다.</div><input type="file" id="galleryInput" accept="image/*" multiple><input type="file" id="cameraInput" accept="image/*" capture="environment"></main>
<script>
const categories=['얼굴형','눈','코','입술','헤어스타일','상의 옷'], protectedParts=['눈썹','눈','코','입술'];const icons={'얼굴형':'◯','눈':'◡','코':'♢','입술':'♡','헤어스타일':'♧','상의 옷':'♧'};const state={photos:[],active:0,protected:new Set(['눈썹']),category:'얼굴형',designs:{},adjustments:{}};const $=id=>document.getElementById(id);
function adj(){return state.adjustments[state.category]??(state.adjustments[state.category]={x:0,y:0,size:100})}
function render(){ $('preserve').replaceChildren(...protectedParts.map(p=>{let b=document.createElement('button');b.className='chip'+(state.protected.has(p)?' on':'');b.textContent=(state.protected.has(p)?'✓ ':'')+p;b.onclick=()=>{state.protected.has(p)?state.protected.delete(p):state.protected.add(p);render()};return b}));
$('tabs').replaceChildren(...categories.map(c=>{let b=document.createElement('button');b.className='tab'+(state.category===c?' on':'');b.textContent=c;b.onclick=()=>{state.category=c;render()};return b}));
$('designs').replaceChildren(...Array.from({length:20},(_,i)=>{let n=i+1,b=document.createElement('button');b.className='design'+(state.designs[state.category]===n?' on':'');b.innerHTML='<span class="shape">'+icons[state.category]+'</span><small>'+state.category+' '+n+'</small>';b.onclick=()=>{state.designs[state.category]=n;render();if(state.photos.length)alert('디자인 '+n+'번을 선택했어요. 실제 얼굴 변경은 합성 기능 연결 후 적용됩니다.')};return b}));
const a=adj();$('adjustPanel').hidden=!state.designs[state.category];$('adjustTitle').textContent=state.category+' 위치 · 크기';$('pos').textContent=a.x+', '+a.y;$('sizeval').textContent=a.size+'%';$('mainImg').hidden=!state.photos.length;$('empty').hidden=!!state.photos.length;if(state.photos.length){$('mainImg').src=state.photos[state.active].url;$('photoLabel').textContent='사진 '+(state.active+1)+' / '+state.photos.length}else $('photoLabel').textContent='사진 미등록';
$('thumbs').replaceChildren(...state.photos.map((p,i)=>{let b=document.createElement('button');b.className='thumb'+(i===state.active?' active':'');b.innerHTML='<img alt="사진 '+(i+1)+'"><span>'+(i+1)+'</span>';b.querySelector('img').src=p.url;b.onclick=()=>{state.active=i;render()};return b}),$('addPhoto'))}
function add(files){for(const file of files){if(!file.type.startsWith('image/'))continue;state.photos.push({name:file.name,url:URL.createObjectURL(file)})}if(state.photos.length)state.active=state.photos.length-1;render()}
$('gallery').onclick=()=> $('galleryInput').click();$('camera').onclick=()=> $('cameraInput').click();$('addPhoto').onclick=()=> $('galleryInput').click();for(const id of ['galleryInput','cameraInput'])$(id).onchange=e=>{add([...e.target.files]);e.target.value=''};
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let a=adj(),d=b.dataset.move;a.x+=(d==='right'?1:d==='left'?-1:0);a.y+=(d==='down'?1:d==='up'?-1:0);render()});$('smaller').onclick=()=>{adj().size=Math.max(50,adj().size-1);render()};$('bigger').onclick=()=>{adj().size=Math.min(150,adj().size+1);render()};$('reset').onclick=()=>{state.adjustments[state.category]={x:0,y:0,size:100};render()};
$('saveImage').onclick=()=>alert('실제 얼굴 합성 및 결과 사진 저장 기능은 아직 연결되지 않았습니다. 원본 사진을 수정 결과로 잘못 저장하지 않도록 저장을 보류합니다.');render();
</script></body></html>
