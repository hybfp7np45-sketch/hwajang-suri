name: Vendor face engine
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/vendor-face.yml']
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          npm pack @mediapipe/tasks-vision@0.10.22
          mkdir -p vendor/mediapipe
          tar -xzf mediapipe-tasks-vision-0.10.22.tgz -C vendor/mediapipe --strip-components=1
          curl -L --fail --retry 3 -o vendor/mediapipe/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task
          rm mediapipe-tasks-vision-0.10.22.tgz
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor/mediapipe
          git commit -m "Vendor MediaPipe face engine assets" || exit 0
          git push
