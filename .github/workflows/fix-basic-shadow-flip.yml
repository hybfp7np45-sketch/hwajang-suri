name: Fix basic shadow orientation

on:
  push:
    paths:
      - '.github/workflows/fix-basic-shadow-flip.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flip only Basic Shadow 1
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('v10-9-8/index.html')
          s = p.read_text(encoding='utf-8')
          old = "if(n==='시그니처 · 섀도우1'){addBrow({name:n,src:browAssets[n],flip:false,ratio:330/700,imgScale:1});return}addBrow({name:n,src:browAssets[n],flip:n==='아치 · 섀도우',ratio:330/700,imgScale:n.includes('섀도우')?.88:1})"
          new = "if(n==='시그니처 · 섀도우1'){addBrow({name:n,src:browAssets[n],flip:false,ratio:330/700,imgScale:1});return}addBrow({name:n,src:browAssets[n],flip:n==='아치 · 섀도우'||n==='기본형 · 섀도우1',ratio:330/700,imgScale:n.includes('섀도우')?.88:1})"
          if old not in s:
              raise SystemExit('Target code not found; no changes made')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v10-9-8/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Flip basic shadow 1 orientation'
          git push
