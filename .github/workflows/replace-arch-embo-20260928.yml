name: Replace arch embo uploaded PNG
on:
  push:
    paths:
      - '.github/workflows/replace-arch-embo-20260928.yml'
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only arch embo asset
        shell: bash
        run: |
          mkdir -p v10-9-8/assets
          echo '' | base64 -d > v10-9-8/assets/arch-embo-original.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v10-9-8/assets/arch-embo-original.png
          git commit -m 'Replace arch embo with user uploaded PNG' || exit 0
          git push