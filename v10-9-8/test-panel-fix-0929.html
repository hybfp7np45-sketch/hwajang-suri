<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}iframe{display:block}</style></head><body><iframe id="app" src="index.html?fresh=panel0929b"></iframe><script>const f=document.getElementById('app');f.onload=()=>{const d=f.contentDocument,w=f.contentWindow;const q=s=>d.querySelector(s),sheet=q('#sheet'),color=q('#colorbar'),layers=q('#layers'),brow=q('#browTab'),colorBtn=q('#colorbtn'),layerBtn=q('#layerbtn'),design=q('#designRail'),rail=q('#rail'),edit=q('#editbar');if(!sheet||!color||!layers||!edit)return;const closeSheet=()=>{sheet.style.setProperty('height','0','important');sheet.className='sheet level1'};const openBrow=()=>{color.classList.remove('show');layers.classList.remove('show');sheet.style.removeProperty('height');if(design)design.style.display='flex';if(rail)rail.style.display='none';sheet.className='sheet level2';setTimeout(dock,0)};const active=()=>{for(const el of [color,layers,sheet]){const r=el.getBoundingClientRect(),cs=w.getComputedStyle(el);if(cs.display!=='none'&&cs.visibility!=='hidden'&&r.height>2)return r}return q('nav').getBoundingClientRect()};function dock(){if(!edit.classList.contains('show'))return;const r=active();edit.style.setProperty('position','fixed','important');edit.style.setProperty('top','auto','important');edit.style.setProperty('bottom',Math.max(0,w.innerHeight-r.top+5)+'px','important')}colorBtn&&colorBtn.addEventListener('click',()=>{closeSheet();layers.classList.remove('show');setTimeout(dock,0)},true);layerBtn&&layerBtn.addEventListener('click',()=>{closeSheet();color.classList.remove('show');setTimeout(dock,0)},true);brow&&brow.addEventListener('pointerup',openBrow,true);brow&&brow.addEventListener('click',openBrow,true);d.addEventListener('click',()=>setTimeout(dock,0),true);new w.MutationObserver(()=>w.requestAnimationFrame(dock)).observe(d.body,{subtree:true,attributes:true,attributeFilter:['class','style']});};</script></body></html>
