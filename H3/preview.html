<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>화장수리 · 미리보기</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;height:100dvh;border:0}</style></head>
<body><iframe id="preview" title="미리보기" allow="camera; fullscreen" allowfullscreen></iframe>
<script>
const lip=new URLSearchParams(location.search).get('type')==='lip';
const label=lip?'입술 컬러 미리보기':'눈썹 디자인 미리보기';
document.title='화장수리 · '+label;
const frame=document.getElementById('preview');
frame.title=label;
frame.addEventListener('load',()=>{
 const doc=frame.contentDocument;
 if(!doc||doc.getElementById('h3-home'))return;
 const camera=doc.querySelector('header button[aria-label="촬영"]');
 if(!camera)return;
 const home=doc.createElement('button');
 home.type='button';home.id='h3-home';home.className=camera.className;
 home.setAttribute('aria-label','홈으로 돌아가기');home.title='홈으로 돌아가기';
 home.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></svg>';
 home.addEventListener('click',()=>{location.href='./index.html';});
 camera.before(home);
});
frame.src=lip?'../L1/index.html?v=61f92555':'../v18.8/index.html?v=0bb2abf3';
</script></body></html>
