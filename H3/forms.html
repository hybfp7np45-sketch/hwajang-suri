617480;border-top:1px solid #d7e2e9;margin-top:25px;padding-top:10px}.question{border-bottom:1px solid #d7e2e9;padding:12px 0;break-inside:avoid}.options{display:flex;gap:20px;margin:7px 0}.options label{display:flex;gap:6px;align-items:center}.options input{width:20px;height:20px;accent-color:#287fa9}.material{background:#f6fafc;padding:12px;margin:12px 0;border-radius:6px}.material h3{margin:0 0 8px;font-size:15px}dialog{border:0;border-radius:16px;width:min(95vw,760px);max-width:95vw;padding:18px;color:#233744}dialog::backdrop{background:#172c38bb}dialog h2{margin:0 0 12px}#signatureCanvas{width:100%;height:clamp(180px,42vh,360px);touch-action:none;background:white;border:1px solid #a3b9c7;display:block}dialog footer{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}body.signing{overflow:hidden}.field>.printvalue,.printvalue{display:none;white-space:pre-wrap;overflow-wrap:anywhere}#status{font-size:13px;color:#526d7c}fieldset{border:0;padding:0;margin:0}legend{font-weight:600}.backlink{display:none}

</style><style>.gender legend{font-size:13px;font-weight:600}.gender-options{display:flex;flex-wrap:nowrap;gap:36px;min-height:44px;margin:0;align-items:center}.field input:not([type=checkbox]):not([type=radio]){height:44px;min-height:44px;max-width:100%;min-width:0;line-height:24px;padding:9px;-webkit-appearance:none;appearance:none}.field input::-webkit-date-and-time-value{text-align:left;min-height:24px}.birth-input{cursor:pointer}#birthDialog{max-width:440px}#birthDialog .wheels{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}.wheel{height:200px;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;border:1px solid #d0dfe8;border-radius:9px;padding:80px 0;scrollbar-width:none}.wheel button{height:40px;width:100%;display:block;border:0;border-radius:0;padding:4px;scroll-snap-align:center;background:transparent}.wheel button[aria-selected=true]{background:#e0f2ff;color:#18658d;font-weight:700}.wheel-label{text-align:center;font-size:13px;color:#587080;margin-bottom:5px}.birth-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}</style><style>body.signing{position:fixed!important;left:0;right:0;width:100%;overflow:hidden!important;overscroll-behavior:none}#signDialog{position:fixed;inset:0;margin:auto;height:fit-content;max-height:calc(100dvh - 24px);overflow:hidden;overscroll-behavior:none;touch-action:none}#signatureCanvas{height:clamp(150px,40dvh,360px);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}</style><style>.policy-choice{margin:18px 0}.policy-choice .options{flex-wrap:wrap;gap:8px 20px}.policy-choice label{min-height:40px}.policy-choice input{width:21px;height:21px}.policy-draft{background:#f2f7fb;padding:12px;border-radius:8px;color:#536b79;font-size:12px}</style></head><body><nav class="toolbar"><a href="./index.html">‹ 홈</a><button class="primary" id="print">PDF 저장 / 공유</button><button id="download">작성본 내려받기</button><span id="status" role="status"></span></nav><p class="hint">작성 칸을 눌러 키보드로 입력하세요. 서명칸을 누르면 큰 서명창이 열립니다. 작성본은 자동으로 서버에 보관되지 않습니다. PDF 저장 시 처음 확인한 A4 양식에 작성 내용과 서명이 들어갑니다.</p><main class="paper" id="paper"></main><dialog id="signDialog" aria-labelledby="signTitle"><h2 id="signTitle">서명해 주세요</h2><p>손가락이나 펜으로 크게 쓴 뒤 ‘완료’를 누르세요.</p><canvas id="signatureCanvas" aria-label="손으로 서명하는 영역"></canvas><footer><button id="cancelSign">취소</button><button id="clearSign">다시 쓰기</button><button class="primary" id="doneSign">완료</button></footer></dialog><script src="./pdf-lib.min.js"></script><script src="./policy-forms.js?v=policy1"></script><script>
const titles={consent:'문신행위 동의서',record:'문신행위 기록지',minor:'미성년자 문신행위 동의서',health:'이용자 건강상태 확인서'};
Object.assign(titles,window.PolicyForms.titles);
const kind=Object.hasOwn(titles,new URLSearchParams(location.search).get('type'))?new URLSearchParams(location.search).get('type'):'consent';
let seq=0;const field=(label,type='text',wide=false)=>{const id='f'+(++seq);if(label==='성별(선택)')return `<fieldset class="field gender"><legend>성별</legend><div class="options gender-options"><label><input type="radio" name="gender-${id}" value="여">여</label><label><input type="radio" name="gender-${id}" value="남">남</label></div></fieldset>`;if(label==='생년월일')return `<label class="field" for="${id}"><span>생년월일</span><input id="${id}" type="text" class="birth-input" readonly placeholder="생년월일 선택" aria-haspopup="dialog"><span class="printvalue"></span></label>`;return `<label class="field ${wide?'wide':''}" for="${id}"><span>${label}</span>${type==='area'?`<textarea id="${id}"></textarea>`:`<input id="${id}" type="${type}">`}<span class="printvalue"></span></label>`};
const fields=(...items)=>`<div class="fields">${items.join('')}</div>`;
const check=text=>`<label class="check"><input type="checkbox"><span>${text}</span></label>`;
const signature=label=>`<div class="signrow"><span>${label}</span><button type="button" class="sig" aria-label="${label} 서명하기"><em>눌러서 서명</em></button></div>`;
const signs=(date,...labels)=>`<section class="signblock ${kind==='record'||kind==='health'?'short':''}"><div class="signrow"><label>${date} <input type="${kind==='consent'?'datetime-local':'date'}" aria-label="${date}"><span class="printvalue"></span></label></div>${labels.map(signature).join('')}</section>`;
const personal=prefix=>fields(field(prefix+' 성명'),field('생년월일','date'),field('성별(선택)'),field('연락처','tel'),field('주소','text',true));
const emergency=()=>fields(field('응급 연락처 성명'),field('관계'),field('응급 연락처 전화','tel'));
const plan=()=>fields(field('시술 부위'),field('시술 예정일','date'),field('담당 시술자'));
let body='';
if(kind==='consent')body=`<p>고객이 설명을 듣고 직접 확인·서명합니다. 건강상태 확인서와 시술 기록지를 함께 연결해 보관합니다.</p><h2>고객·시술 정보</h2>${personal('고객')}${emergency()}${plan()}<h2>01 상담 및 최종 선택</h2>${fields(field('고객 희망 기법·디자인·컬러','area',true),field('시술자 제안 및 희망과 다른 경우의 설명 (피부·모량·기존 잔흔 고려)','area',true),field('최종 기법'),field('최종 디자인'),field('최종 색상'),field('총 비용'),field('리터치 포함 범위·횟수·기한','area',true))}<h2>02 설명받은 내용 확인</h2>${[
'시술 방법·과정·예상 회복 경과와 시술 전후 주의사항을 설명받았습니다.',
'통증·붓기·붉어짐·각질, 감염·알레르기·흉터·색 변화·번짐 등 가능한 이상반응을 설명받았습니다.',
'피부 상태와 기존 잔흔, 관리·회복에 따라 착색·유지기간·대칭에 차이가 날 수 있으며, 수정·제거가 어렵거나 별도 비용이 들 수 있음을 이해했습니다.',
'앱 미리보기·사진·디자인은 상담 자료이며 실제 착색 결과를 보장하지 않음을 이해했습니다.',
'시술하지 않는 선택이 가능하며, 시술 전에는 질문하거나 계획 변경·동의 철회를 요청할 수 있음을 안내받았습니다.',
'이상 증상 발생 시 연락 방법과 의료기관 진료가 필요한 상황, 사후관리 방법을 안내받았습니다.'
].map(check).join('')}${fields(field('개별 설명·주의사항','area',true))}<p>위 설명을 이해하고 최종 확인한 계획에 따른 시술에 자발적으로 동의합니다. 이 동의는 시술자의 과실에 대한 책임을 면제하지 않습니다.</p>${signs('설명·동의 일시','고객','설명한 시술자')}`;
if(kind==='record'){
body=`<p>시술자가 작성합니다. 색소는 실제 사용한 제품별로 기록하고 혼합 비율·사용량을 남깁니다.</p><h2>업소·시술자</h2>${fields(field('상호'),field('대표자'),field('업소 연락처','tel'),field('시술자'),field('면허·등록 식별정보 (해당 시)','text',true))}<h2>고객·시술 정보</h2>${personal('고객')}${fields(field('시술 일시','datetime-local'),field('시술 부위'),field('범위 (가로 × 세로, cm)'),field('기법·디자인'),field('건강상태 특이사항 / 기존 시술·잔흔 / 추가 확인·상담 결과','area',true))}<h2>01 사용 재료</h2>`;
for(let n=1;n<=3;n++)body+=`<section class="material"><h3>제품 ${n}</h3>${fields(...['바늘 제조사·제품명','바늘 종류·규격 / 제조번호','일반의약품 제조사·제품명 (사용한 경우)','일반의약품 제조번호·사용량','염료 제조사·브랜드','염료 제품명·컬러','염료 제조번호·사용기한','염료 사용량(mL)·혼합 비율'].map(x=>field(x)))}</section>`;
body+=`<h2>02 경과 및 관리</h2>${fields(field('실제 시술 내용 / 계획 변경·추가 설명·중단 여부','area',true),field('시술 중·직후 이상반응·상태 / 조치·진료 안내','area',true),field('사후관리 안내자료 전달 여부'),field('다음 확인일','date'),field('연결 동의서 번호 / 사진 파일 번호','text',true))}<p>위 기록이 실제 시술 내용과 일치함을 확인합니다.</p>${signs('작성일','대표자','시술자')}`;
}
if(kind==='minor')body=`<p>미성년자 본인과 법정대리인의 의사를 각각 확인합니다. 보호자 동의만으로 시술 가능 여부가 확정되지는 않습니다.</p><h2>미성년자</h2>${personal('미성년자')}<h2>법정대리인</h2>${personal('법정대리인')}${fields(field('미성년자와의 관계'))}<h2>업소·시술 정보</h2>${fields(field('업소 상호'),field('업소 연락처','tel'))}${plan()}${fields(field('최종 기법·디자인·색상','area',true))}<h2>설명 및 의사 확인</h2>${['시술 방법·범위·디자인·색상과 비용·리터치 조건을 설명받았습니다.','색소가 장기간 남을 수 있다는 점과 수정·제거의 어려움, 감염·알레르기·흉터·색 변화·번짐 등 가능한 부작용을 설명받았습니다.','사후관리·회복 경과, 이상 증상 발생 시 연락 및 진료 안내를 받았습니다.','미성년자 본인이 시술을 원하며, 강요 없이 결정했고 질문·거절할 기회가 있었습니다.','법정대리인이 설명을 이해하고 동의하며, 신분과 대리권을 확인하는 절차에 협조합니다.'].map(check).join('')}${fields(field('추가 설명·확인 사항','area',true))}<p>위 내용을 이해하고 설명받은 계획에 따른 시술에 동의합니다.</p>${signs('동의일','미성년자','법정대리인','시술자')}<h2>확인 서류</h2>${['미성년자의 나이 및 신분을 확인할 수 있는 서류를 확인함','법정대리인의 신분을 확인할 수 있는 서류를 확인함','가족관계증명서 등 법정대리인 관계 확인 서류를 확인함'].map(check).join('')}${fields(field('확인한 서류 종류 및 확인자 (불필요한 고유식별정보는 기재하지 마세요)','area',true))}`;
if(kind==='health'){
const qs=['문신을 받은 경험이 있습니까? (부위·시기)','문신 후 염증·흉터·피부색 변화 등 이상반응이 있었습니까?','문신용 색소에 알레르기 반응이 있었습니까? (제품·색상)','현재 시술 부위에 상처·염증·발진·기타 피부 이상이 있습니까?','최근 3개월 내 피부과 치료·시술을 받았습니까? (내용·시기)','켈로이드·흉터 과다 형성 또는 상처 회복 지연 경험이 있습니까?','약물·금속·소독제·라텍스 등 알레르기가 있습니까?','심장·혈관질환, 고혈압·당뇨·고지혈증·출혈질환 등이 있습니까?','B형·C형 간염, HIV 등 혈액매개감염병 진단·치료 이력이 있습니까?','실신·뇌전증 등 의식 소실·경련 경험이나 관련 질환이 있습니까?','현재 발열·오한·심한 피로 등 몸 상태에 이상이 있습니까?','복용·사용 중인 약이 있습니까? (항응고제·아스피린 등 포함)','최근 24시간 내 음주했습니까?','임신·수유 중이거나 가능성이 있습니까?','입술 물집 병력이 있습니까? (입술 시술 시)'];
body=`<p>고객이 각 항목을 직접 확인해 주세요. ‘예’ 또는 ‘모름’인 경우 상담 시 알려 주세요.</p>${personal('고객')}${plan()}${emergency()}<h2>건강상태 확인</h2>${qs.map((q,n)=>`<fieldset class="question"><legend>${n+1}. ${q}</legend><div class="options">${['예','아니요','모름'].map(a=>`<label><input type="radio" name="q${n}" value="${a}">${a}</label>`).join('')}</div>${field('상세 내용')}</fieldset>`).join('')}<h2>건강정보 처리 별도 동의 (민감정보)</h2><p>안전한 시술 여부 확인·상담 및 관련 기록 관리 목적으로 위 건강정보를 처리합니다.</p>${fields(field('정보를 처리하는 업소명'),field('보유·이용기간 (업소에서 고지)'))}<p>동의를 거부할 수 있으며, 안전 확인에 필요한 정보를 확인할 수 없으면 시술이 제한될 수 있습니다.</p><fieldset><legend>건강정보 처리에 동의하십니까?</legend><div class="options"><label><input type="radio" name="privacy" value="동의">동의</label><label><input type="radio" name="privacy" value="미동의">미동의</label></div></fieldset><p>제가 알고 있는 건강정보를 사실대로 작성했습니다. 추가 확인이나 의료기관 상담이 필요하거나 건강상의 이유로 시술이 연기·중단될 수 있음을 이해했습니다. 처방약을 임의로 중단하지 않습니다.</p>${signs('작성일','고객','확인한 시술자')}`;

const requiredFieldNames=new Set(['고객 성명','미성년자 성명','법정대리인 성명','생년월일','연락처','주소','시술 부위','시술 예정일','담당 시술자','최종 기법','최종 디자인','최종 색상','총 비용','리터치 포함 범위·횟수·기한','상호','대표자','업소 연락처','시술자','시술 일시','범위 (가로 × 세로, cm)','기법·디자인','미성년자와의 관계','업소 상호','최종 기법·디자인·색상','정보를 처리하는 업소명','보유·이용기간 (업소에서 고지)']);
function highlightRequired(el){el.classList.add('required-label');const tag=document.createElement('small');tag.className='required-note';tag.textContent='필수';el.after(tag);}
document.querySelectorAll('.field').forEach(label=>{const title=label.querySelector('span');if(title&&requiredFieldNames.has(title.textContent)){highlightRequired(title);label.querySelector('input,textarea')?.setAttribute('aria-required','true');}});

const dialog=document.getElementById('signDialog'),canvas=document.getElementById('signatureCanvas'),ctx=canvas.getContext('2d');let target=null,strokes=[],active=null,pointer=null,rect=null,scrollBeforeSign=0;
function penStyle(){ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#132d3d';ctx.fillStyle='#132d3d'}
function dot(p){ctx.beginPath();ctx.arc(p.x*rect.width,p.y*rect.height,1.25,0,Math.PI*2);ctx.fill()}
function segment(a,b){ctx.beginPath();ctx.moveTo(a.x*rect.width,a.y*rect.height);ctx.lineTo(b.x*rect.width,b.y*rect.height);ctx.stroke()}
function draw(){rect=canvas.getBoundingClientRect();const d=Math.min(devicePixelRatio||1,3),w=Math.round(rect.width*d),h=Math.round(rect.height*d);if(canvas.width!==w)canvas.width=w;if(canvas.height!==h)canvas.height=h;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,rect.width,rect.height);penStyle();for(const stroke of strokes){if(stroke.length)dot(stroke[0]);for(let i=1;i<stroke.length;i++)segment(stroke[i-1],stroke[i])}}
function point(e){return{x:Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width)),y:Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height))}}
document.querySelectorAll('.sig').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();if(dialog.open)return;target=b;strokes=b._strokes?JSON.parse(JSON.stringify(b._strokes)):[];scrollBeforeSign=window.scrollY;document.body.style.top='-'+scrollBeforeSign+'px';document.body.classList.add('signing');dialog.showModal();requestAnimationFrame(draw)}));
canvas.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(pointer!==null)return;rect=canvas.getBoundingClientRect();pointer=e.pointerId;canvas.setPointerCapture(pointer);active=[point(e)];strokes.push(active);penStyle();dot(active[0])},{passive:false});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==pointer||!active)return;e.preventDefault();e.stopPropagation();const samples=e.getCoalescedEvents?.()||[e];for(const sample of samples.length?samples:[e]){const next=point(sample);segment(active[active.length-1],next);active.push(next)}},{passive:false});
function end(e){if(e.pointerId!==pointer)return;if(e.cancelable)e.preventDefault();e.stopPropagation();pointer=null;active=null}
canvas.addEventListener('pointerup',end,{passive:false});canvas.addEventListener('pointercancel',end,{passive:false});canvas.addEventListener('lostpointercapture',end);
canvas.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()});
dialog.addEventListener('cancel',e=>e.preventDefault());dialog.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
let resizeFrame;window.addEventListener('resize',()=>{if(!dialog.open)return;cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(draw)});
document.getElementById('clearSign').onclick=()=>{strokes=[];pointer=null;active=null;draw()};
document.getElementById('cancelSign').onclick=()=>dialog.close();
dialog.addEventListener('close',()=>{pointer=null;active=null;document.body.classList.remove('signing');document.body.style.top='';window.scrollTo(0,scrollBeforeSign);target?.focus({preventScroll:true})});
document.getElementById('doneSign').onclick=()=>{if(!strokes.length){document.getElementById('signTitle').textContent='먼저 서명해 주세요';return}const img=new Image();img.src=canvas.toDataURL('image/png');img.alt=target.getAttribute('aria-label').replace('하기','');target.replaceChildren(img);target._strokes=JSON.parse(JSON.stringify(strokes));dialog.close();document.getElementById('signTitle').textContent='서명해 주세요'};
function sync(){document.querySelectorAll('input:not([type=radio]):not([type=checkbox]),textarea').forEach(el=>{let p=el.nextElementSibling;if(p?.classList.contains('printvalue'))p.textContent=el.value||' ';});}

function formatPhone(value){
 if(/^\s*\+/.test(value))return value;
 const n=value.replace(/\D/g,'');
 if(n.length>11)return value;
 if(n.startsWith('02')){
  if(n.length<=2)return n;
  if(n.length<=5)return n.slice(0,2)+'-'+n.slice(2);
  const middle=n.length===9?3:4;
  if(n.length<=2+middle)return n.slice(0,2)+'-'+n.slice(2);
  return n.slice(0,2)+'-'+n.slice(2,2+middle)+'-'+n.slice(2+middle);
 }
 if(n.length===8&&!n.startsWith('0'))return n.slice(0,4)+'-'+n.slice(4);
 if(n.length<=3)return n;
 if(n.length<=7)return n.slice(0,3)+'-'+n.slice(3);
 const middle=n.startsWith('010')?4:(n.length===10?3:4);
 return n.slice(0,3)+'-'+n.slice(3,3+middle)+'-'+n.slice(3+middle);
}
document.querySelectorAll('input[type="tel"]').forEach(input=>{
 input.inputMode='tel';input.autocomplete='tel';input.placeholder='010-1234-5678';
 input.addEventListener('input',()=>{
  const raw=input.value,position=input.selectionStart??raw.length,digitsBefore=raw.slice(0,position).replace(/\D/g,'').length;
  const next=formatPhone(raw);if(next===raw)return;input.value=next;
  let cursor=0,count=0;while(cursor<next.length&&count<digitsBefore){if(/\d/.test(next[cursor]))count++;cursor++}
  if(position===raw.length)cursor=next.length;
  try{input.setSelectionRange(cursor,cursor)}catch(e){}
  sync();
 });
});
