<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>상담차트 · 화장수리</title><style>*{box-sizing:border-box}body{margin:0;background:#edf5fa;color:#283b4b;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}header{position:sticky;top:0;z-index:1;background:#fff;border-bottom:1px solid #dce8ef;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}header a,header button{font:inherit;font-size:13px;color:#246b98;background:#edf6fc;border:0;border-radius:9px;padding:10px 12px;text-decoration:none}h1{font-size:16px;flex:1;margin:0;min-width:120px}main{max-width:850px;margin:18px auto;padding:0 10px}.sheet{display:block;width:100%;height:auto;background:#fff;box-shadow:0 6px 28px #243e591a}p{font-size:13px;color:#567185;line-height:1.6}button{cursor:pointer}@page{size:A4;margin:0}@media print{header,.help{display:none}body{background:#fff}main{margin:0;padding:0;max-width:none}.sheet{width:210mm;max-height:297mm;box-shadow:none;object-fit:contain}}</style></head><body><header><a href="./index.html">‹ 홈</a><h1 id="chartTitle">상담차트</h1><a id="downloadChart" download>PDF 저장</a><button type="button" id="printChart">인쇄</button></header><main><p class="help">확대해서 확인하거나 PDF로 저장하고 인쇄할 수 있어요.</p><img class="sheet" id="chartImage" alt=""><p id="chartError" hidden>차트를 찾을 수 없습니다. 홈에서 다시 선택해 주세요.</p></main><script>
const charts={brow:'눈썹 상담차트',scalp:'두피 · 헤어라인 상담차트',lip:'입술 상담차트',eyeliner:'아이라인 상담차트'};
const type=new URLSearchParams(location.search).get('type');
if(Object.hasOwn(charts,type)){document.title=charts[type]+' · 화장수리';document.getElementById('chartTitle').textContent=charts[type];const img=document.getElementById('chartImage');img.alt=charts[type];img.src='./charts/'+type+'.jpg'+(type==='lip'?'?v=lip-layout-20261028':'');const link=document.getElementById('downloadChart');link.href='./charts/'+type+'.pdf'+(type==='lip'?'?v=lip-layout-20261028':'');link.download=type+'-consultation-chart.pdf';document.getElementById('printChart').onclick=()=>{if(img.complete&&img.naturalWidth)window.print();else img.addEventListener('load',()=>window.print(),{once:true});};}else{document.getElementById('chartImage').hidden=true;document.getElementById('downloadChart').hidden=true;document.getElementById('printChart').hidden=true;document.getElementById('chartError').hidden=false;}
</script></body></html>
