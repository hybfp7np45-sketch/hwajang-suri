<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>상담차트 · 화장수리</title><link rel="stylesheet" href="./chart-form.css?v=palette11-row"></head><body>
<header><div class="heading"><a href="./index.html">‹ 홈</a><h1 id="chartTitle">상담차트</h1></div><div class="actions"><button id="previewChart" type="button">작성본 미리보기</button><button class="primary" id="saveChart" type="button">PDF 저장 / 공유</button></div></header>
<main id="main"><p class="intro">작성 칸을 눌러 키보드로 입력하세요. 고객 항목을 먼저 작성한 뒤 시술자가 이어서 작성합니다.</p><form id="chartForm" novalidate><section id="customerSection" aria-labelledby="customerTitle"><div class="section-heading"><span class="step">1</span><h2 id="customerTitle">고객 작성</h2></div><div id="customerFields"></div><button id="toPractitioner" type="button" class="continue">고객 작성 완료 · 시술자 항목으로 ↓</button></section><section id="practitionerSection" aria-labelledby="practitionerTitle"><div class="section-heading"><span class="step">2</span><h2 id="practitionerTitle">시술자 작성</h2></div><div id="practitionerFields"></div></section><button class="primary bottom-save" id="saveChartBottom" type="button">PDF 저장 / 공유</button></form><div id="saveResult" hidden></div><p id="status" role="status" aria-live="polite"></p><p class="privacy">입력 내용은 서버에 자동 보관되지 않습니다. 작성 후 PDF로 저장해 주세요.</p></main>
<dialog id="previewDialog" aria-labelledby="previewTitle"><div class="preview-heading"><h2 id="previewTitle">저장되는 상담차트</h2><button id="closePreview" type="button">닫기</button></div><img id="chartPreview" alt="입력 내용이 채워진 A4 상담차트"><p id="previewStatus" role="status"></p></dialog>
<script src="./pdf-lib.min.js"></script><script src="./chart-model.js?v=chart-drawing-v3"></script><script src="./chart-drawing.js?v=palette11-row"></script><script src="./chart-form.js?v=combos1"></script></body></html>
