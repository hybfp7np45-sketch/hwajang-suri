const PERSONAL_BROW_KEY='hwajang-personal-brows-v1';
let currentBrowDesign='';
function personalBrows(){try{return JSON.parse(localStorage.getItem(PERSONAL_BROW_KEY)||'{}')}catch(e){return{}}}
function savePersonalBrows(v){try{localStorage.setItem(PERSONAL_BROW_KEY,JSON.stringify(v));return true}catch(e){alert('파일이 너무 커서 저장하지 못했어요. PNG 크기를 줄여 다시 시도해 주세요.');return false}}
function personalFor(design){return personalBrows()[design]||[]}
function addPersonalButton(design){const btn=document.createElement('button');btn.className='card personal-add';btn.dataset.design=design;btn.type='button';btn.innerHTML='<div class="mini" style="display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:300">＋</div><small>내 결 추가</small>';rail.appendChild(btn)}
function renderPersonalBrow(design,item){const btn=document.createElement('button');btn.className='card tech-card personal-tech';btn.dataset.name=item.name;btn.dataset.src=item.src;btn.dataset.personalId=item.id;const mini=document.createElement('div');mini.className='mini';const im=document.createElement('img');im.style.cssText='width:100%;height:100%;object-fit:contain;';im.src=item.src;mini.appendChild(im);const sm=document.createElement('small');sm.textContent=item.name;btn.append(mini,sm);rail.appendChild(btn)}
function showTech(design){currentBrowDesign=design;rail.innerHTML='';const techs=design==='시그니처'?['시그니처 · 엠보1','시그니처 · 섀도우1','시그니처 · 헤스1']:design==='기본형'?['기본형 · 엠보1','기본형 · 섀도우1','기본형 · 헤스1']:design==='일자형'?['일자형 · 엠보1','일자형 · 섀도우1','일자형 · 헤스1']:design==='세미아치'?['세미아치 · 엠보1','세미아치 · 섀도우1','세미아치 · 헤스1']:design==='아치형'?['아치형 · 엠보1','아치형 · 섀도우1','아치형 · 헤스1']:design==='각진아치'?[]:[];rail.style.display='flex';S.className='sheet level3';techs.forEach(n=>{const btn=document.createElement('button');btn.className='card tech-card';btn.dataset.name=n;const mini=document.createElement('div');mini.className='mini';const im=document.createElement('img');im.style.cssText='width:100%;height:100%;object-fit:contain;';im.src=browAssets[n];mini.appendChild(im);const sm=document.createElement('small');sm.textContent=n.split(' · ')[1];btn.append(mini,sm);rail.appendChild(btn)});personalFor(design).forEach(x=>renderPersonalBrow(design,x));addPersonalButton(design)}
function showMaleTech(type){rail.innerHTML='';const techs=type==='결눈썹'?['남자 결눈썹 · 헤스1','남자 결눈썹 · 헤스2','남자 결눈썹 · 헤스3','남자 결눈썹 · 헤스4']:[];if(!techs.length){rail.style.display='none';S.className='sheet level2';return}rail.style.display='flex';S.className='sheet level3';techs.forEach((n,i)=>{const btn=document.createElement('button');btn.className='card tech-card';btn.dataset.name=n;const mini=document.createElement('div');mini.className='mini';const im=document.createElement('img');im.style.cssText='width:100%;height:100%;object-fit:contain;';im.src=browAssets[n];mini.appendChild(im);const sm=document.createElement('small');sm.textContent='헤스'+(i+1);btn.append(mini,sm);rail.appendChild(btn)})}
