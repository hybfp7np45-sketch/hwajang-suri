function photoErrorMessage(f,detail){

}
async function loadHEICConverter(){
 if(typeof window.heic2any==='function')return window.heic2any;
 if(!window._heicConverterPromise){
  window._heicConverterPromise=new Promise((resolve,reject)=>{
   const script=document.createElement('script');
   script.src='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
   script.onload=()=>typeof window.heic2any==='function'?resolve(window.heic2any):reject(new Error('변환기 초기화 실패'));
   script.onerror=()=>reject(new Error('변환기 다운로드 실패 (네트워크 또는 카카오톡 브라우저 차단)'));
   document.head.appendChild(script);
  }).catch(err=>{window._heicConverterPromise=null;throw err});
 }
 return window._heicConverterPromise;
}
async function showBlob(f){
 if(!f||!f.size){photoErrorMessage(f||{},'파일 데이터가 비어 있음');return}
 const ext=(f.name||'').split('.').pop().toLowerCase();
 if(['heic','heif'].includes(ext)||/heic|heif/i.test(f.type)){
  try{
   const convert=await loadHEICConverter();
   const output=await convert({blob:f,toType:'image/jpeg',quality:0.92});
   const jpeg=Array.isArray(output)?output[0]:output;
   if(!jpeg||!jpeg.size)throw new Error('변환된 이미지가 비어 있음');
   f=new File([jpeg],(f.name||'photo').replace(/\.(heic|heif)$/i,'')+'.jpg',{type:'image/jpeg'});
  }catch(err){photoErrorMessage(f,'HEIC JPG 자동변환 실패: '+(err&&err.message||err));return}
 }
 const tempURL=URL.createObjectURL(f);
 const probe=new Image();
 probe.onload=()=>{
  if(!probe.naturalWidth||!probe.naturalHeight){URL.revokeObjectURL(tempURL);photoErrorMessage(f,'이미지 크기 확인 실패');return}
  const oldURL=photoURL;
  P.onload=()=>{try{resetLoadedPhoto()}catch(err){alert('사진 표시 후 오류: '+(err&&err.message||err))}if(oldURL)URL.revokeObjectURL(oldURL)};
  P.onerror=()=>{URL.revokeObjectURL(tempURL);photoErrorMessage(f,'화면 이미지 표시 실패')};
  photoURL=tempURL;P.src=tempURL;
 };
 probe.onerror=()=>{
  URL.revokeObjectURL(tempURL);
  // Data URL fallback for Android in-app browsers.
  const reader=new FileReader();
  reader.onload=()=>{
   const img=new Image();
   img.onload=()=>{P.onload=()=>{try{resetLoadedPhoto()}catch(err){alert('사진 표시 후 오류: '+(err&&err.message||err))}releasePreviousPhotoURL();photoURL=P.src};P.onerror=()=>photoErrorMessage(f,'DataURL 화면 표시 실패');P.src=reader.result};
   img.onerror=()=>photoErrorMessage(f,'Blob URL 및 DataURL 디코딩 실패');
   img.src=reader.result;
  };
  reader.onerror=()=>photoErrorMessage(f,'파일 읽기 실패');
  reader.readAsDataURL(f);
 };
 probe.src=tempURL;
}
async function load(f){if(!f)return;try{await showBlob(f)}catch(e){photoErrorMessage(f,'예외: '+(e&&e.message||e))}}

let stream=null,facing='environment',camZoom=1,camPinch=null,currentDeviceId=null;const cv=$('camview'),video=$('camvideo'),grid=$('grid');
function applyCamZoom(){video.style.transform='scale('+camZoom+')'}
async function stopCamStream(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;await new Promise(r=>setTimeout(r,120))}
async function cameraDevices(){try{return (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput')}catch(_){return[]}}
async function requestFacing(target){
 await stopCamStream();
 let s=null;
 try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:target},width:{ideal:1280},height:{ideal:1600}},audio:false})}catch(_){}
 if(!s){try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:target},width:{ideal:1280},height:{ideal:1600}},audio:false})}catch(_){}}
 return s
}
async function openCam(){
 cv.style.display='block';cv.classList.add('show');$('gridbtn').textContent=grid.classList.contains('on')?'Guide OFF':'Guide ON';
 try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('mediaDevices unavailable');stream=await requestFacing(facing);if(!stream)throw new Error('camera unavailable');video.srcObject=stream;video.setAttribute('playsinline','');video.muted=true;await video.play();currentDeviceId=stream.getVideoTracks()[0]?.getSettings?.().deviceId||null;camZoom=1;applyCamZoom()}catch(err){alert('카메라를 열 수 없어요. 카메라 권한을 확인해 주세요.');closeCam()}
}
$('camera').onclick=openCam;
$('flipcam').onclick=async e=>{e.preventDefault();e.stopPropagation();const target=facing==='environment'?'user':'environment';try{
 const oldId=currentDeviceId;let next=await requestFacing(target);
 if(next){let id=next.getVideoTracks()[0]?.getSettings?.().deviceId||null;if(id&&oldId&&id===oldId){next.getTracks().forEach(t=>t.stop());next=null}}
 if(!next){const devs=await cameraDevices();const candidates=devs.filter(d=>d.deviceId&&d.deviceId!==oldId);if(candidates.length){const wanted=candidates.find(d=>target==='user'?/front|user|전면/i.test(d.label):/back|rear|environment|후면/i.test(d.label))||candidates[0];next=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:wanted.deviceId},width:{ideal:1280},height:{ideal:1600}},audio:false})}}
 if(!next)throw new Error('no alternate camera');stream=next;facing=target;video.srcObject=stream;await video.play();currentDeviceId=stream.getVideoTracks()[0]?.getSettings?.().deviceId||null;camZoom=1;applyCamZoom()
 }catch(err){alert('이 기기에서 전·후면 카메라 전환을 완료하지 못했어요. 카메라 권한을 확인해 주세요.')}}
$('gridbtn').onclick=()=>{grid.classList.toggle('on');$('gridbtn').textContent=grid.classList.contains('on')?'Guide OFF':'Guide ON'};
function closeCam(){cv.classList.remove('show');cv.style.display='none';video.style.transform='scale(1)';stopCamStream()}$('camclose').onclick=closeCam;
video.addEventListener('touchstart',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];camPinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:camZoom};e.preventDefault()}},{passive:false});
video.addEventListener('touchmove',e=>{if(e.touches.length===2&&camPinch){const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);camZoom=Math.max(1,Math.min(4,camPinch.z*d/camPinch.d));applyCamZoom();e.preventDefault()}},{passive:false});
video.addEventListener('touchend',e=>{if(e.touches.length<2)camPinch=null},{passive:false});
$('shot').onclick=()=>{const c=$('camcanvas'),ctx=c.getContext('2d'),vw=video.videoWidth,vh=video.videoHeight;c.width=vw;c.height=vh;const sw=vw/camZoom,sh=vh/camZoom,sx=(vw-sw)/2,sy=(vh-sh)/2;ctx.drawImage(video,sx,sy,sw,sh,0,0,vw,vh);c.toBlob(blob=>{showPhoto(blob);closeCam()},'image/jpeg',.94)};

$('save').onclick=async()=>{
 if(!photoURL){alert('사진을 먼저 불러오거나 촬영해 주세요.');return}
 const c=document.createElement('canvas');c.width=P.naturalWidth;c.height=P.naturalHeight;const ctx=c.getContext('2d');ctx.drawImage(P,0,0);

 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.98));if(!blob){alert('사진을 저장하지 못했어요.');return}
 const name='hwajang-suri-lip-'+Date.now()+'.jpg',f=new File([blob],name,{type:'image/jpeg'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);
};

const stage=document.querySelector('.stage'),touches=new Map(),gestureMoved=new Map();
let zoom=1,panX=0,panY=0,pinch=null,lastTap=0;
function setWorld(){const t='translate('+panX+'px,'+panY+'px) scale('+zoom+')';$('photo').style.transform=t;$('lipOverlay').style.transform=t;$('lipBoundary').style.transform=t;drawBoundary()}
function resetView(){zoom=1;panX=0;panY=0;pinch=null;touches.clear();gestureMoved.clear();setWorld()}
stage.addEventListener('pointerdown',e=>{
 if(!photoURL)return;
 touches.set(e.pointerId,{x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY});gestureMoved.set(e.pointerId,false);
 try{stage.setPointerCapture(e.pointerId)}catch(_){}
 if(touches.size===2){
 const p=[...touches.values()],dx=p[1].x-p[0].x,dy=p[1].y-p[0].y;
 pinch={dist:Math.max(1,Math.hypot(dx,dy)),zoom,panX,panY,cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2};lastTap=0;e.preventDefault();
 }
});
stage.addEventListener('pointermove',e=>{
 const t=touches.get(e.pointerId);if(!t)return;t.x=e.clientX;t.y=e.clientY;
 if(Math.hypot(t.x-t.startX,t.y-t.startY)>7)gestureMoved.set(e.pointerId,true);
 if(touches.size===2&&pinch){
 const p=[...touches.values()],dist=Math.max(1,Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y));
 const cx=(p[0].x+p[1].x)/2,cy=(p[0].y+p[1].y)/2;
 zoom=Math.max(1,Math.min(4,pinch.zoom*dist/pinch.dist));panX=pinch.panX+(cx-pinch.cx);panY=pinch.panY+(cy-pinch.cy);setWorld();e.preventDefault();
 }
});
function endPhotoPointer(e){
 const wasTwo=!!pinch||touches.size>1,moved=gestureMoved.get(e.pointerId);
 touches.delete(e.pointerId);gestureMoved.delete(e.pointerId);if(touches.size<2)pinch=null;
 if(!wasTwo&&!moved&&e.type!=='pointercancel'){const now=Date.now();if(now-lastTap<330){panelOpen=false;$('color-panel').hidden=true;render();lastTap=0}else lastTap=now}else lastTap=0;
}
stage.addEventListener('pointerup',endPhotoPointer);stage.addEventListener('pointercancel',endPhotoPointer);
stage.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
['contextmenu','selectstart','dragstart'].forEach(ev=>stage.addEventListener(ev,e=>e.preventDefault()));

const LIP_OUTER=[61,185,40,39,37,0,267,269,270,409,291,375,321,405,314,17,84,181,91,146];

function lipStatus(text){$('lipDetection').hidden=false;$('lipDetection').textContent=text}
async function getLipModel(){
 if(lipState.model)return lipState.model;
 if(!lipState.promise)lipState.promise=(async()=>{
 const root='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
 const {FaceLandmarker,FilesetResolver}=await import(root+'/vision_bundle.mjs');
 const files=await FilesetResolver.forVisionTasks(root+'/wasm');
 const model=await FaceLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'CPU'},runningMode:'IMAGE',numFaces:1,minFaceDetectionConfidence:.5,minFacePresenceConfidence:.5});
 lipState.model=model;return model;
 })().catch(e=>{lipState.promise=null;throw e});
 return lipState.promise;
}

function loadLipScript(url,ready){
 if(ready())return Promise.resolve();
 return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=url;script.crossOrigin='anonymous';const timer=setTimeout(()=>{script.remove();reject(new Error('SCRIPT_TIMEOUT'))},25000);script.onload=()=>{clearTimeout(timer);ready()?resolve():reject(new Error('SCRIPT_INIT'))};script.onerror=()=>{clearTimeout(timer);script.remove();reject(new Error('SCRIPT_LOAD'))};document.head.append(script)});
}
let alternativeLipModel=null,alternativeLipPromise=null;
async function alternativeLipDetect(input){
 if(!alternativeLipPromise)alternativeLipPromise=(async()=>{
 await loadLipScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js',()=>!!window.tf);
 await window.tf.setBackend('cpu');await window.tf.ready();
 await loadLipScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/face-detection@1.0.3/dist/face-detection.min.js',()=>!!window.faceDetection);
 await loadLipScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@1.0.6/dist/face-landmarks-detection.min.js',()=>!!window.faceLandmarksDetection);
 alternativeLipModel=await window.faceLandmarksDetection.createDetector(window.faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh,{runtime:'tfjs',refineLandmarks:false,maxFaces:1});
 return alternativeLipModel;
 })().catch(e=>{alternativeLipPromise=null;throw e});
 const model=await alternativeLipPromise,faces=await model.estimateFaces(input,{flipHorizontal:false,staticImageMode:true});
 return faces[0]?.keypoints.map(p=>({x:p.x/input.width,y:p.y/input.height,z:(p.z||0)/input.width}));
}
let lipWorker=null,lipWorkerSeq=0;

const paletteKey='suri.L1.myPalette.v1';let myColors=[],draft=[],sampling=false,makerURL=null;
try{const v=JSON.parse(localStorage.getItem(paletteKey)||'[]');if(Array.isArray(v))myColors=v.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&/^#[0-9a-f]{6}$/i.test(x.hex))}catch(e){}
function syncMyPalette(){for(const key of Object.keys(palettes)){palettes[key]=myColors.map(x=>[x.name,x.hex]);selected[key]=Math.min(selected[key],Math.max(0,myColors.length-1))}render()}
function drawCatalog(){
 const catalog=$('catalog'),scroll=catalog.scrollTop;
 catalog.replaceChildren();
 for(const [brand,label] of [['perma','Perma Blend (펄마)'],['tina','Tina Davies (티나 데이비스)'],['evenflo','Evenflo (이븐플로)'],['luxe','LUXE (럭스)']]){
  const title=document.createElement('h2');title.className='catalog-brand';title.textContent=label;catalog.append(title);
  pigmentCatalog.filter(x=>x.brand===brand).forEach(x=>{
   const button=makeColorButton(x.name,x.hex,draft.some(c=>c.id===x.id));button.title=x.name;
   button.onclick=()=>{const i=draft.findIndex(c=>c.id===x.id);if(i<0)draft.push({...x});else draft.splice(i,1);drawCatalog()};
   catalog.append(button);
  });
 }
 catalog.scrollTop=scroll;
 $('picked').replaceChildren();
 draft.forEach((x,i)=>{const button=makeColorButton(x.name,x.hex);button.onclick=()=>{draft.splice(i,1);drawCatalog()};$('picked').append(button)});
}
$('openPalette').onclick=()=>{draft=myColors.map(x=>({...x}));$('paletteBuilder').hidden=false;$('paletteStatus').textContent='';drawCatalog()};$('brandFilter').onchange=drawCatalog;$('closePalette').onclick=()=>{$('paletteBuilder').hidden=true};
$('applyPalette').onclick=()=>{try{localStorage.setItem(paletteKey,JSON.stringify(draft))}catch(e){$('paletteStatus').textContent='저장 공간을 확인해 주세요. 팔레트를 저장하지 못했어요.';return}myColors=draft.map(x=>({...x}));syncMyPalette();$('paletteBuilder').hidden=true};
function stopSampling(){sampling=false;document.body.classList.remove('sampling');$('sampleColor').setAttribute('aria-pressed','false')}
function closeMaker(){stopSampling();$('customMaker').hidden=true;$('paletteBuilder').hidden=false;drawCatalog()}
$('openMaker').onclick=()=>{$('paletteBuilder').hidden=true;$('customMaker').hidden=false};$('closeMaker').onclick=closeMaker;
function setCustomColor(hex){$('customColor').value=hex;$('customHex').value=hex}
$('customColor').oninput=e=>setCustomColor(e.target.value);$('customHex').onchange=e=>{if(/^#[0-9a-f]{6}$/i.test(e.target.value))setCustomColor(e.target.value);else e.target.value=$('customColor').value};
$('addCustomColor').onclick=()=>{const name=$('customName').value.trim()||'내 컬러 '+(draft.filter(x=>x.brand==='custom').length+1);draft.push({id:'custom:'+Date.now()+':'+Math.random(),brand:'custom',name,hex:$('customColor').value});$('customName').value='';closeMaker()};
$('loadColorPhoto').onclick=()=>$('colorPhotoFile').click();$('colorPhotoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(makerURL)URL.revokeObjectURL(makerURL);makerURL=URL.createObjectURL(f);const img=$('makerPhoto');img.onload=()=>{img.hidden=false};img.onerror=()=>{$('makerHint').textContent='사진을 불러오지 못했어요. JPG 또는 PNG로 다시 시도해 주세요.'};img.src=makerURL;e.target.value=''};
$('sampleColor').onclick=()=>{sampling=!sampling;document.body.classList.toggle('sampling',sampling);$('sampleColor').setAttribute('aria-pressed',String(sampling));$('makerHint').textContent=sampling?'사진 또는 불러온 색에서 원하는 부분을 찍어 주세요.':'색을 직접 고르거나 사진에서 원하는 부분을 찍어 주세요.'};
function pixelAt(img,e,transformed=false){const r=img.getBoundingClientRect(),scale=Math.min(r.width/img.naturalWidth,r.height/img.naturalHeight),w=img.naturalWidth*scale,h=img.naturalHeight*scale,x=(e.clientX-r.left-(r.width-w)/2)/scale,y=(e.clientY-r.top-(r.height-h)/2)/scale;if(x<0||y<0||x>=img.naturalWidth||y>=img.naturalHeight)return;const c=document.createElement('canvas');c.width=c.height=1;const ctx=c.getContext('2d');ctx.drawImage(img,Math.floor(x),Math.floor(y),1,1,0,0,1,1);const v=ctx.getImageData(0,0,1,1).data;setCustomColor('#'+[...v].slice(0,3).map(n=>n.toString(16).padStart(2,'0')).join(''));stopSampling();$('makerHint').textContent='찍은 색을 가져왔어요. 이름을 정하고 추가해 주세요.'}
$('makerPhoto').onclick=e=>{if(sampling)pixelAt(e.currentTarget,e)};
const sampleStage=document.querySelector('.stage');sampleStage.addEventListener('pointerdown',e=>{if(!sampling||$('customMaker').hidden)return;e.stopImmediatePropagation();e.preventDefault();if(P.naturalWidth)pixelAt(P,e)},true);
$('photoGridToggle').onclick=()=>{const on=$('photoGrid').classList.toggle('on');$('photoGridToggle').textContent='격자 '+(on?'ON':'OFF');$('photoGridToggle').setAttribute('aria-pressed',String(on))};syncMyPalette();
