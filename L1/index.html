<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>화장수리 · 입술 컬러 L1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#304b5d;background:#e9f5fb}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #168fc7;outline-offset:3px}.app{height:100dvh;max-width:560px;margin:auto;display:flex;flex-direction:column;background:#f6fbfe;overflow:hidden}header{flex-shrink:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#e9f7ff;border-bottom:1px solid #dcecf5}h1{font-size:17px;margin:0;letter-spacing:-.6px}header small{font-size:10px;color:#82a1b4;margin-left:6px}.tools{display:flex;gap:7px}.tool{border:1px solid #d3e7f3;background:#fff;border-radius:12px;height:38px;padding:0 11px;font-size:12px;font-weight:650;display:flex;align-items:center;gap:5px}.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.stage{flex:1;min-height:120px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#edf3f6}.stage img{width:100%;height:100%;object-fit:contain;display:none}.empty{text-align:center;color:#8aa4b5;font-size:14px;line-height:1.9}.empty svg{width:60px;height:60px;display:block;margin:0 auto 16px;stroke:#acc8d9;fill:none;stroke-width:1.3}.photo-label{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#ffffffdc;border-radius:20px;padding:6px 12px;font-size:10px;color:#7393a6;white-space:nowrap}.panel{flex-shrink:0;background:white;padding:0 0 calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;box-shadow:0 -5px 22px #7191a510;position:relative}.tabs{display:flex;padding:7px 22px 0;gap:12px;border-bottom:1px solid #edf3f7}.tab{flex:1;height:49px;border:0;background:none;color:#91a4b0;position:relative;font-size:16px;font-weight:650}.tab[aria-selected=true]{color:#2996c8}.tab[aria-selected=true]:after{content:"";height:3px;border-radius:4px;background:#49acd8;position:absolute;bottom:0;left:25%;right:25%}.selection{padding:14px 22px 11px;font-size:12px;display:flex;align-items:center;justify-content:space-between}.selection strong{font-weight:650}.selection span{color:#9cafbc;font-size:10px}.colors{display:flex;overflow-x:auto;gap:13px;padding:2px 22px 12px;scrollbar-width:none}.colors::-webkit-scrollbar{display:none}.swatch{flex:0 0 66px;padding:0;border:0;background:none;display:flex;align-items:center;flex-direction:column;gap:9px;font-size:11px;color:#788e9e}.chip{width:62px;height:62px;background:var(--c);border-radius:17px;display:grid;place-items:center;position:relative;box-shadow:inset 0 0 0 1px #00000005}.swatch[aria-pressed=true] .chip{outline:2px solid #42a6d3;outline-offset:3px}.swatch[aria-pressed=true] .chip:after{content:"✓";font-size:28px;color:white;text-shadow:0 1px 4px #0005}.swatch[aria-pressed=true]{color:#2d8db9;font-weight:700}.note{text-align:center;font-size:10px;color:#a5b5bf;margin:3px 0 0}.overlay{position:fixed;inset:0;background:#0007;z-index:10;display:flex;align-items:flex-end;justify-content:center}.overlay[hidden],.camera[hidden]{display:none}.sheet{width:100%;max-width:560px;padding:15px 16px calc(16px + env(safe-area-inset-bottom));background:#fff;border-radius:22px 22px 0 0;display:grid;gap:8px}.sheet button{height:50px;border:0;border-radius:13px;background:#edf7fd;font-size:15px;font-weight:650}.sheet button:last-child{background:white;color:#8a9da9}.camera{position:fixed;inset:0;background:#111;z-index:20;display:flex;flex-direction:column}.camera video{flex:1;min-height:0;width:100%;object-fit:contain}.cam-head,.cam-foot{display:flex;justify-content:space-between;align-items:center;padding:16px max(20px,env(safe-area-inset-left));color:white}.cam-head button,.cam-foot button{background:#ffffff20;border:0;border-radius:22px;padding:11px 17px;color:#fff}.cam-foot{padding-bottom:calc(20px + env(safe-area-inset-bottom));justify-content:center}.cam-foot #shutter{width:68px;height:68px;border:5px solid #aaa;background:white;border-radius:50%;padding:0}.status{font-size:12px;color:#b8c9d3;text-align:center}

/* L1: v18.8 toolbar geometry, pale pink theme, bottom design rail and upper color sheet */
html,body{background:#fff;color:#493a41;overflow:hidden;overscroll-behavior:none}
.app{max-width:none;padding-top:env(safe-area-inset-top);background:#fcf7f9;position:relative}
header{height:58px;gap:9px;padding:8px 13px;justify-content:flex-start;background:#fff;border-bottom:1px solid #f1e8eb;z-index:4}
.tool{width:42px;height:42px;border:0;border-radius:13px;background:#fff0f5;color:#e9a1bb;display:grid;place-items:center;padding:0}
.tool svg{width:24px;height:24px;display:block;fill:none;stroke:#e9a1bb;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.save{margin-left:auto}
.stage{margin:8px auto;width:min(calc(100vw - 16px),calc((100dvh - 150px - env(safe-area-inset-top) - env(safe-area-inset-bottom))*.8));max-height:calc(100% - 150px);aspect-ratio:4/5;border-radius:18px;background:#eee8ea;flex:1}
.empty{color:#ad959f}.empty svg{stroke:#d6b5c4}.photo-label{color:#a17d8d}
.panel{height:calc(76px + env(safe-area-inset-bottom));padding:0 0 env(safe-area-inset-bottom);border-radius:0;box-shadow:none;background:#fff;z-index:3;position:relative}
.tabs{height:76px;align-items:center;justify-content:center;gap:8px;padding:3px 12px 5px;border:0}
.tab{flex:0 0 auto;width:auto;min-width:76px;height:34px;border-radius:9px;padding:0 17px;background:#fff;border:1px solid #ead8de;font-size:12px;font-weight:700;color:#967b87}
.tab[aria-selected=true]{background:#fff0f5;border-color:#df7596;color:#c66d8f}
.tab[aria-selected=true]:after{display:none}
#color-panel{position:absolute;bottom:76px;left:0;right:0;border-radius:22px 22px 0 0;background:rgba(255,255,255,.98);box-shadow:0 -8px 28px #00000014;padding:8px 0 6px}
#color-panel[hidden]{display:none}
#color-panel:before{content:"";display:block;width:42px;height:5px;border-radius:5px;background:#e6d8de;margin:0 auto 4px}
.selection{padding:5px 14px 9px}.selection strong{font-size:12px}.selection span{color:#b69ca8}
.colors{gap:12px;padding:5px 14px 12px}.swatch{color:#947a86}.swatch[aria-pressed=true]{color:#c66d8f}
.swatch[aria-pressed=true] .chip{outline-color:#e39bb5}
.note{display:none}.sheet button{background:#fff0f5}.sheet button:last-child{color:#997f8c}
</style></head><body>
<main class="app"><header><button class="tool" id="camera" aria-label="촬영"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 7.3 8.7 5h6.6l1.5 2.3H19a2 2 0 0 1 2 2v7.2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9.3a2 2 0 0 1 2-2h2.2Z"/><circle cx="12" cy="12.5" r="3.5"/></svg></button><button class="tool" id="upload" aria-label="사진 불러오기"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.2" r="3.2"/><path d="M5.7 19c.5-4 2.8-6 6.3-6s5.8 2 6.3 6"/></svg></button><button class="tool save" id="save" aria-label="저장"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m8.5 11.5 3.5 3.5 3.5-3.5"/><path d="M5 19h14"/></svg></button></header>
<section class="stage" aria-label="사진 미리보기"><div class="empty" id="empty"><svg viewBox="0 0 64 64"><rect x="9" y="7" width="46" height="50" rx="9"/><circle cx="24" cy="23" r="5"/><path d="m10 48 15-15 10 10 9-9 11 12"/></svg>사진을 촬영하거나<br>사진을 불러오세요</div><img id="photo" alt="불러온 고객 사진"><span class="photo-label" id="photoLabel" hidden>원본 사진</span></section>
<section class="panel"><div class="tabs" role="tablist" aria-label="입술 컬러 영역"><button class="tab" id="tab-tone" role="tab" aria-selected="false" aria-controls="color-panel" data-group="톤업">톤업</button><button class="tab" id="tab-base" role="tab" aria-selected="false" aria-controls="color-panel" data-group="베이스">베이스</button><button class="tab" id="tab-point" role="tab" aria-selected="false" aria-controls="color-panel" data-group="포인트">포인트</button></div><div id="color-panel" hidden role="tabpanel" aria-labelledby="tab-tone"><div class="selection"><strong id="selection"></strong><span>컬러를 선택해 보세요</span></div><div class="colors" id="colors"></div></div><p class="note">컬러 선택 화면 · 입술 색상 적용은 다음 단계에서 추가됩니다</p></section></main>
<input type="file" accept="image/*" id="photos" hidden><input type="file" accept="image/*" id="files" hidden>
<div class="overlay" id="picker" hidden><div class="sheet" role="dialog" aria-modal="true" aria-label="사진 불러오기"><button id="pickPhotos">사진 불러오기</button><button id="pickFiles">파일 불러오기</button><button id="cancelPick">취소</button></div></div>
<div class="camera" id="camView" hidden><div class="cam-head"><button id="closeCam">닫기</button><span>촬영</span><button id="flipCam">전·후면 전환</button></div><video id="video" autoplay muted playsinline></video><div class="status" id="camStatus"></div><div class="cam-foot"><button id="shutter" aria-label="사진 촬영"></button></div></div>
<script>
const $=id=>document.getElementById(id);
const palettes={'톤업':[['피치톤업','#f5b9a6'],['핑크톤업','#efb0b9'],['살몬톤업','#ee9c8e'],['코랄톤업','#f1a18a'],['로즈톤업','#d99aa5'],['누드톤업','#dfb4a7']],'베이스':[['립베이스','#eec3b8'],['연핑크','#d9899c'],['로즈','#b96176'],['살구','#da9484'],['코랄','#de8173'],['누드','#ba8b80'],['모브','#ac7a91']],'포인트':[['핑크','#d65c88'],['로즈레드','#bb405b'],['체리','#b92c4e'],['레드','#c73e45'],['코랄레드','#df6253'],['플럼','#843d60'],['버건디','#783247']]};
let panelOpen=false;let group='톤업',selected={'톤업':0,'베이스':0,'포인트':0},photoURL=null,stream=null,facing='environment';
function render(){document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(panelOpen&&t.dataset.group===group)));$('color-panel').setAttribute('aria-labelledby',document.querySelector('.tab[data-group="'+group+'"]').id);$('selection').textContent=group+' · '+palettes[group][selected[group]][0];$('colors').replaceChildren(...palettes[group].map(([name,color],i)=>{let b=document.createElement('button');b.className='swatch';b.setAttribute('aria-label',name);b.setAttribute('aria-pressed',String(i===selected[group]));let chip=document.createElement('span');chip.className='chip';chip.style.setProperty('--c',color);let label=document.createElement('span');label.textContent=name;b.append(chip,label);b.onclick=()=>{selected[group]=i;render()};return b}));}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{group=t.dataset.group;panelOpen=true;$('color-panel').hidden=false;render();$('colors').scrollLeft=0});render();
$('upload').onclick=()=>{$('picker').hidden=false};$('cancelPick').onclick=()=>{$('picker').hidden=true};$('picker').onclick=e=>{if(e.target===$('picker'))$('picker').hidden=true};
for(const [button,input] of [['pickPhotos','photos'],['pickFiles','files']]){$(button).onclick=()=>{$('picker').hidden=true;$(input).click()};$(input).onchange=()=>{const f=$(input).files[0];if(f)showPhoto(f);$(input).value=''};}
function showPhoto(blob){const u=URL.createObjectURL(blob);const img=$('photo');img.onload=()=>{if(photoURL)URL.revokeObjectURL(photoURL);photoURL=u;img.style.display='block';$('empty').hidden=true;$('photoLabel').hidden=false};img.onerror=()=>{URL.revokeObjectURL(u);alert('사진을 열 수 없어요. 다른 사진을 선택해 주세요.')};img.src=u;}
function stopStream(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;}
async function startCamera(target){stopStream();let next;try{next=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{exact:target},width:{ideal:1280},height:{ideal:1600}}})}catch(e){next=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:target},width:{ideal:1280},height:{ideal:1600}}})}stream=next;$('video').srcObject=stream;await $('video').play();facing=target;}
function closeCamera(){stopStream();$('camView').hidden=true;}
$('camera').onclick=async()=>{$('camView').hidden=false;$('camStatus').textContent='카메라를 여는 중…';try{await startCamera(facing);$('camStatus').textContent=''}catch(e){closeCamera();alert('카메라를 열 수 없어요. 카메라 권한을 확인해 주세요.')}};
$('closeCam').onclick=closeCamera;$('flipCam').onclick=async()=>{try{await startCamera(facing==='user'?'environment':'user')}catch(e){$('camStatus').textContent='카메라 전환을 완료하지 못했어요.'}};
$('shutter').onclick=()=>{const v=$('video');if(!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(b=>{if(b){showPhoto(b);closeCamera()}},'image/jpeg',.98)};
$('save').onclick=async()=>{if(!photoURL){alert('사진을 먼저 불러오거나 촬영해 주세요.');return}const blob=await fetch(photoURL).then(r=>r.blob());const name='hwajang-suri-lip-'+Date.now()+'.jpg';const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){if(e.name!=='AbortError')download()} }else download();function download(){const a=document.createElement('a');a.href=photoURL;a.download=name;a.click()}};
$('photo').addEventListener('click',()=>{panelOpen=false;$('color-panel').hidden=true;render()});
window.addEventListener('pagehide',stopStream);document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('picker').hidden=true;closeCamera()}});
</script></body></html>
