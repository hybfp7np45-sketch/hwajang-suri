function paintLips(){

$('lipRetry').onclick=()=>detectLips();
$('lipStrength').oninput=e=>{lipState.strength=Number(e.target.value);$('lipStrengthValue').value=lipState.strength+'%';paintLips()};
$('lipCompare').onclick=()=>{lipState.compare=!lipState.compare;$('lipOverlay').style.visibility=lipState.compare?'hidden':'visible';$('lipCompare').setAttribute('aria-pressed',String(lipState.compare));$('lipCompare').textContent=lipState.compare?'컬러 보기':'원본 비교'};

function syncBoundaryButtons(){

}

 svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.setAttribute('preserveAspectRatio','xMidYMid meet');svg.replaceChildren();
 for(const [ids,color,label] of [[LIP_OUTER,'#ed6f9e','바깥 입술선'],[LIP_INNER,'#58bad0','입 안쪽 경계']]){

let lipDrag=null,boundaryBackup=null,boundaryView=null;
$('lipBoundary').addEventListener('pointerdown',e=>{

});

 const rect=stage.getBoundingClientRect(),sw=stage.clientWidth,sh=stage.clientHeight,w=P.naturalWidth,h=P.naturalHeight,fit=Math.min(sw/w,sh/h),rw=w*fit,rh=h*fit;

$('boundaryToggle').onclick=()=>{

window.addEventListener('resize',drawBoundary);

let lipPaintPending=false,lipLensFrame=0,lipLensTouch=null;

document.addEventListener('touchstart',e=>{if(e.touches.length>1)hideLipLens()},{passive:true});

$('manualLip').onclick=beginManualLip;

}
function manualPhotoPoint(e){
 const rect=stage.getBoundingClientRect(),sw=stage.clientWidth,sh=stage.clientHeight,fit=Math.min(sw/P.naturalWidth,sh/P.naturalHeight),rw=P.naturalWidth*fit,rh=P.naturalHeight*fit;
