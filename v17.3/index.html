<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>화장수리 | 기존 눈썹 분리 실험</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4fbff;color:#263944}header{padding:14px 16px;background:white;border-bottom:1px solid #d8eaf5;font-weight:700}main{max-width:650px;margin:auto;padding:12px}p{font-size:13px;line-height:1.6;color:#587080}button,.upload{border:1px solid #acd8ee;background:white;color:#286c8d;padding:11px 12px;border-radius:12px;font-weight:650;font-size:13px;cursor:pointer}button.active{background:#bde8fa}input[type=file]{display:none}.bar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.bar>*{flex:1;text-align:center;white-space:nowrap}#viewport{position:relative;width:100%;background:#e1eaf0;border-radius:14px;overflow:hidden;touch-action:none;min-height:300px;display:flex;align-items:center;justify-content:center}canvas{display:block;max-width:100%;max-height:64vh;touch-action:none}label{font-size:13px}input[type=range]{width:100%}.control{padding:10px 12px;background:white;border-radius:12px;margin:10px 0}.hint{font-size:12px;color:#667f8b}#status{font-size:12px;min-height:24px;color:#28759d}.small{font-size:11px}</style></head><body><header>화장수리 · 기존 눈썹 분리 실험 01</header><main><p>고객 사진을 불러와 <b>눈썹 털이 있는 부분만</b> 브러시로 지정해 봐. 지정한 영역에서 어두운 선을 추출해 별도 투명 레이어로 미리 보여줘. <b>원본 사진은 변경하지 않아.</b></p><div class="bar"><label class="upload">사진 불러오기<input id="file" type="file" accept="image/*"></label><button id="paint" class="active">영역 선택</button><button id="erase">선택 지우기</button><button id="clear">초기화</button></div><div id="viewport"><canvas id="screen"></canvas></div><div class="control"><label>브러시 크기 <span id="brushValue">24</span></label><input id="brush" type="range" min="5" max="100" value="24"><label>털 추출 강도 <span id="thresholdValue">45</span></label><input id="threshold" type="range" min="5" max="95" value="45"><div class="hint">강도를 높이면 더 많은 어두운 픽셀이 털로 선택돼. 반영구 잔흔도 함께 선택될 수 있어.</div></div><div class="bar"><button id="original" class="active">원본 + 선택</button><button id="hair">털 레이어만</button><button id="composite">원본 + 털 강조</button></div><div class="bar"><button id="save">털 레이어 PNG 저장</button><button id="undo">선택 되돌리기</button></div><div id="status">사진을 불러와 줘.</div><p class="small">1차 검증용: 색상·명암 기반 분리이므로 털과 비슷한 색의 잔흔을 완벽히 구별하지 못해. 실제 AI 털 인식 및 피부 복원 기능은 다음 단계야.</p></main><script>
const $=s=>document.querySelector(s),screen=$('#screen'),ctx=screen.getContext('2d',{willReadFrequently:true});let source=null,mask=null,mode='paint',view='original',drawing=false,prev=null,history=[];const brush=$('#brush'),threshold=$('#threshold');
function load(file){if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const scale=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));screen.width=Math.round(img.naturalWidth*scale);screen.height=Math.round(img.naturalHeight*scale);const tmp=document.createElement('canvas');tmp.width=screen.width;tmp.height=screen.height;const c=tmp.getContext('2d');c.drawImage(img,0,0,tmp.width,tmp.height);source=c.getImageData(0,0,tmp.width,tmp.height);mask=new Uint8Array(tmp.width*tmp.height);history=[];render();$('#status').textContent='눈썹 털이 있는 부분을 손가락으로 칠해 줘.';URL.revokeObjectURL(url)};img.src=url}
$('#file').onchange=e=>load(e.target.files[0]);brush.oninput=()=>$('#brushValue').textContent=brush.value;threshold.oninput=()=>{$('#thresholdValue').textContent=threshold.value;render()};
function point(e){const r=screen.getBoundingClientRect();return{x:(e.clientX-r.left)*screen.width/r.width,y:(e.clientY-r.top)*screen.height/r.height}}
function dab(x,y){if(!mask)return;const rad=+brush.value/2,xx=Math.round(x),yy=Math.round(y),w=screen.width,h=screen.height;for(let py=Math.max(0,Math.floor(yy-rad));py<Math.min(h,Math.ceil(yy+rad));py++)for(let px=Math.max(0,Math.floor(xx-rad));px<Math.min(w,Math.ceil(xx+rad));px++){const d=Math.hypot(px-x,py-y);if(d<=rad)mask[py*w+px]=mode==='paint'?255:0}}
function stroke(a,b){const d=Math.hypot(a.x-b.x,a.y-b.y),n=Math.max(1,Math.ceil(d/3));for(let i=0;i<=n;i++)dab(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n)}
screen.addEventListener('pointerdown',e=>{if(!source||drawing)return;e.preventDefault();screen.setPointerCapture(e.pointerId);history.push(mask.slice());if(history.length>15)history.shift();drawing=true;prev=point(e);dab(prev.x,prev.y);render()});screen.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=point(e);stroke(prev,p);prev=p;render()});function finish(){drawing=false;prev=null}screen.addEventListener('pointerup',finish);screen.addEventListener('pointercancel',finish);
function extract(){const out=new ImageData(screen.width,screen.height);if(!source)return out;const s=source.data,d=out.data,w=screen.width,h=screen.height,t=+threshold.value/100;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const p=y*w+x;if(!mask[p])continue;const i=p*4,r=s[i],g=s[i+1],b=s[i+2];const lum=.299*r+.587*g+.114*b;let neighbor=0,count=0;for(let dy=-3;dy<=3;dy+=3)for(let dx=-3;dx<=3;dx+=3){const k=((y+dy)*w+x+dx)*4;neighbor+=.299*s[k]+.587*s[k+1]+.114*s[k+2];count++}neighbor/=count;const contrast=Math.max(0,neighbor-lum);const darkness=Math.max(0,(180-lum)/180);const strength=Math.max(0,Math.min(1,(contrast/48*.75+darkness*.35-(1-t)*.75)*2));d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=Math.round(strength*mask[p])}return out}
function render(){if(!source)return;ctx.clearRect(0,0,screen.width,screen.height);const hair=extract();if(view==='hair'){ctx.putImageData(hair,0,0);return}ctx.putImageData(source,0,0);if(view==='composite'){const c=document.createElement('canvas');c.width=screen.width;c.height=screen.height;c.getContext('2d').putImageData(hair,0,0);ctx.globalAlpha=.8;ctx.drawImage(c,0,0);ctx.globalAlpha=1;return}const d=ctx.getImageData(0,0,screen.width,screen.height);for(let i=0;i<mask.length;i++)if(mask[i]){const k=i*4,a=.28;d.data[k]=d.data[k]*(1-a)+56*a;d.data[k+1]=d.data[k+1]*(1-a)+177*a;d.data[k+2]=d.data[k+2]*(1-a)+232*a}ctx.putImageData(d,0,0)}
for(const id of ['paint','erase'])$('#'+id).onclick=()=>{mode=id;$('#paint').classList.toggle('active',id==='paint');$('#erase').classList.toggle('active',id==='erase')};for(const id of ['original','hair','composite'])$('#'+id).onclick=()=>{view=id;for(const k of ['original','hair','composite'])$('#'+k).classList.toggle('active',id===k);render()};$('#clear').onclick=()=>{if(!mask)return;history.push(mask.slice());mask.fill(0);render()};$('#undo').onclick=()=>{if(!history.length)return;mask=history.pop();render()};$('#save').onclick=()=>{if(!source)return;const c=document.createElement('canvas');c.width=screen.width;c.height=screen.height;c.getContext('2d').putImageData(extract(),0,0);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='hwajang-suri-eyebrow-hair-layer.png';a.click()};
</script></body></html>
