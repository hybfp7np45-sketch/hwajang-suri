<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#fff7fa"><link rel="manifest" href="manifest.webmanifest"><title>화장수리</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#fff7fa;color:#2b2427}button{font:inherit}
#app{width:100vw;height:100dvh;display:grid;grid-template-rows:58px minmax(0,1fr) 72px;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border-bottom:1px solid #f1e5e9;z-index:20}.ico{width:42px;height:42px;border:0;border-radius:13px;background:#fff0f5;font-size:20px}.save{margin-left:auto}
main{min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;position:relative;overflow:hidden}#stage{position:relative;height:min(100%,calc((100vw - 20px)*1.25));width:auto;max-width:calc(100vw - 20px);aspect-ratio:4/5;background:#eee7ea;border-radius:18px;overflow:hidden;touch-action:none}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#9b8d93}
.brow{position:absolute;width:27%;height:9%;top:36%;touch-action:none;transform-origin:center}.brow.left{left:20%}.brow.right{right:20%}.brow svg{width:100%;height:100%;overflow:visible}.brow.left svg{transform:scaleX(-1)}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #f1e5e9;z-index:30}nav button{border:0;background:#fff;font-size:13px}.active{color:#cf527b;font-weight:700}
#sheet{position:absolute;z-index:25;left:0;right:0;bottom:0;height:0;overflow:hidden;background:rgba(255,255,255,.97);border-radius:20px 20px 0 0;box-shadow:0 -8px 24px #0001;transition:height .18s}#sheet.open{height:190px}.handle{width:42px;height:5px;background:#ddd;border-radius:8px;margin:8px auto}.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px 10px}.preset{height:92px;border:1px solid #f0dce3;border-radius:13px;background:#fff8fa;padding:4px}.preset svg{width:100%;height:60px}.preset small{display:block;text-align:center}
</style></head><body><div id="app">
<header><button class="ico" id="cam">📷</button><button class="ico" id="gal">⌕</button><button class="ico save" id="save">⇩</button><input id="camIn" type="file" accept="image/*" capture="environment" hidden><input id="galIn" type="file" accept="image/*" hidden></header>
<main><div id="stage"><img id="photo"><div id="empty">사진을 촬영하거나<br>사진첩에서 불러오세요</div><div class="brow left" id="left"></div><div class="brow right" id="right"></div></div><div id="sheet"><div class="handle"></div><div class="presets" id="presets"></div></div></main>
<nav><button class="active" id="browTab">눈썹</button><button>입술</button><button>아이라인</button><button>헤어라인</button></nav></div>
<script>
const $=s=>document.querySelector(s),photo=$('#photo'),sheet=$('#sheet'),L=$('#left'),R=$('#right');
function browSvg(v=0){let p=[];for(let i=0;i<13;i++){let t=i/12,x=4+t*112,base=48-23*Math.sin(t*Math.PI*.92)-(v*2*Math.sin(t*Math.PI));let tilt=18*(1-t)+4;let len=22-9*t+4*Math.sin(t*Math.PI);p.push('<path d="M'+x+' '+base+' Q'+(x+tilt*.38)+' '+(base-len*.55)+' '+(x+tilt)+' '+(base-len)+'" fill="none" stroke="#3b2924" stroke-width="'+(2.4-0.8*t)+'" stroke-linecap="round" opacity="'+(.72+.2*Math.sin(t*Math.PI))+'"/>')}return '<svg viewBox="0 0 120 60">'+p.join('')+'</svg>'}
['내추럴','소프트','스트레이트','아치'].forEach((n,i)=>$('#presets').insertAdjacentHTML('beforeend','<button class="preset" data-i="'+i+'">'+browSvg(i)+'<small>'+n+'</small></button>'));
$('#presets').onclick=e=>{let b=e.target.closest('.preset');if(!b)return;L.innerHTML=R.innerHTML=browSvg(+b.dataset.i);L.style.display=R.style.display='block';[L,R].forEach(x=>{x.dataset.v='0,0,1,0';x.style.transform=''})};
$('#cam').onclick=()=>$('#camIn').click();$('#gal').onclick=()=>$('#galIn').click();function load(f){if(!f)return;photo.src=URL.createObjectURL(f);photo.style.display='block';$('#empty').style.display='none';L.style.display=R.style.display='none'}$('#camIn').onchange=e=>load(e.target.files[0]);$('#galIn').onchange=e=>load(e.target.files[0]);$('#browTab').onclick=()=>sheet.classList.toggle('open');
function gestures(el){let pts={},base=null;const apply=(x,y,s,r)=>{el.style.transform='translate('+x+'px,'+y+'px) scale('+s+') rotate('+r+'deg)';el.dataset.v=[x,y,s,r].join(',')};el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);pts[e.pointerId]=[e.clientX,e.clientY];base={pts:structuredClone(pts),v:(el.dataset.v||'0,0,1,0').split(',').map(Number)}};el.onpointermove=e=>{if(!pts[e.pointerId])return;pts[e.pointerId]=[e.clientX,e.clientY];let a=Object.values(pts),b=Object.values(base.pts),v=base.v;if(a.length===1)apply(v[0]+a[0][0]-b[0][0],v[1]+a[0][1]-b[0][1],v[2],v[3]);else{let d0=Math.hypot(b[1][0]-b[0][0],b[1][1]-b[0][1]),d=Math.hypot(a[1][0]-a[0][0],a[1][1]-a[0][1]);let q0=Math.atan2(b[1][1]-b[0][1],b[1][0]-b[0][0]),q=Math.atan2(a[1][1]-a[0][1],a[1][0]-a[0][0]);apply(v[0],v[1],Math.max(.35,Math.min(2.5,v[2]*d/d0)),v[3]+(q-q0)*180/Math.PI)}};el.onpointerup=el.onpointercancel=e=>delete pts[e.pointerId]}gestures(L);gestures(R);
$('#save').onclick=()=>alert('테스트판입니다. 합성 저장은 다음 수정에서 연결됩니다.');
</script></body></html>
