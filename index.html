 el.addEventListener('pointermove',e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;if(st.h==='rot'){el.dataset.rot=st.rot+(Math.atan2(e.clientY-st.cy,e.clientX-st.cx)-Math.atan2(st.y-st.cy,st.x-st.cx))*180/Math.PI;apply(el);return}let l=st.left,t=st.top,w=st.w,h=st.hgt;if(['e','ne','se'].includes(st.h))w=Math.max(30,st.w+dx);if(['w','nw','sw'].includes(st.h)){w=Math.max(30,st.w-dx);l=st.left+st.w-w}if(['s','se','sw'].includes(st.h))h=Math.max(18,st.hgt+dy);if(['n','ne','nw'].includes(st.h)){h=Math.max(18,st.hgt-dy);t=st.top+st.hgt-h}if(['nw','ne','se','sw'].includes(st.h)){const ratio=st.w/st.hgt;if(Math.abs(dx)>=Math.abs(dy))h=w/ratio;else w=h*ratio;if(['nw','ne'].includes(st.h))t=st.top+st.hgt-h;if(['nw','sw'].includes(st.h))l=st.left+st.w-w}Object.assign(el.style,{left:l+'px',top:t+'px',width:w+'px',height:h+'px'})});
 el.addEventListener('pointerup',()=>st=null);el.addEventListener('pointercancel',()=>st=null);
}

let layerDrag=null;
function commitLayerOrder(){
 const ids=[...layers.querySelectorAll('.layerrow[data-id]')].map(r=>r.dataset.id).reverse(),by=Object.fromEntries(brows.map(b=>[b.dataset.id,b]));
 brows=ids.map(id=>by[id]).filter(Boolean);syncZ()
}
layers.addEventListener('click',e=>{
 if(e.target.closest('.layerclose')){layers.classList.remove('show');return}
 const ctl=e.target.closest('[data-order]'),row=e.target.closest('.layerrow[data-id]');
 if(ctl&&row){e.preventDefault();e.stopPropagation();const el=brows.find(x=>x.dataset.id===row.dataset.id);if(el)select(el);
  const sib=ctl.dataset.order==='up'?row.previousElementSibling:row.nextElementSibling;
  if(sib&&sib.classList.contains('layerrow')&&sib.dataset.fixed!=='skin'){
   if(ctl.dataset.order==='up')layers.insertBefore(row,sib);else layers.insertBefore(sib,row);
   commitLayerOrder()
  } return
 }
 if(row){const el=brows.find(x=>x.dataset.id===row.dataset.id);if(el)select(el)}
});
let layerPress=null;
layers.addEventListener('pointerdown',e=>{const row=e.target.closest('.layerrow[data-id]');if(!row||e.target.closest('[data-order]'))return;layerPress={row,pid:e.pointerId,y:e.clientY,active:false}});
layers.addEventListener('pointermove',e=>{
 if(!layerPress||e.pointerId!==layerPress.pid)return;
 if(!layerPress.active&&Math.abs(e.clientY-layerPress.y)>12){layerPress.active=true;layerPress.row.classList.add('dragging');layerPress.row.setPointerCapture?.(e.pointerId)}
 if(!layerPress.active)return;
 const row=layerPress.row, rows=[...layers.querySelectorAll('.layerrow')].filter(r=>r!==row);
 const over=rows.find(r=>{const q=r.getBoundingClientRect();return e.clientY>=q.top&&e.clientY<=q.bottom});
 if(over&&over.dataset.fixed!=='skin'){const q=over.getBoundingClientRect();layers.insertBefore(row,e.clientY<q.top+q.height/2?over:over.nextSibling)}
 const box=layers.getBoundingClientRect();if(e.clientY>box.bottom-30)layers.scrollTop+=12;else if(e.clientY<box.top+45)layers.scrollTop-=12;e.preventDefault()
});
function finishLayer(e){if(!layerPress||e.pointerId!==layerPress.pid)return;if(layerPress.active){layerPress.row.classList.remove('dragging');commitLayerOrder()}layerPress=null}
layers.addEventListener('pointerup',finishLayer);layers.addEventListener('pointercancel',finishLayer);
let stageDrag=null,lastTap=0;
function setWorld(){world.style.transform='translate('+panX+'px,'+panY+'px) scale('+zoom+')'}
stage.addEventListener('pointerdown',e=>{
 if(e.target.closest('.rh')||e.target.closest('button'))return;
 touches.set(e.pointerId,{x:e.clientX,y:e.clientY});stage.setPointerCapture(e.pointerId);
 if(touches.size===2){const p=[...touches.values()],dx=p[1].x-p[0].x,dy=p[1].y-p[0].y;pinch={dist:Math.hypot(dx,dy),zoom,panX,panY,cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2};stageDrag=null;e.preventDefault();return}
 const now=Date.now();if(!e.target.closest('.brow')&&now-lastTap<330){select(null);lastTap=0;e.preventDefault();return}lastTap=now;
 if(selected){stageDrag={id:e.pointerId,x:e.clientX,y:e.clientY,left:parseFloat(selected.style.left),top:parseFloat(selected.style.top),el:selected};e.preventDefault()}
});
stage.addEventListener('pointermove',e=>{
 if(touches.has(e.pointerId))touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(touches.size===2&&pinch){const p=[...touches.values()],dx=p[1].x-p[0].x,dy=p[1].y-p[0].y,nz=Math.max(1,Math.min(4,pinch.zoom*Math.hypot(dx,dy)/pinch.dist)),cx=(p[0].x+p[1].x)/2,cy=(p[0].y+p[1].y)/2;panX=pinch.panX+(cx-pinch.cx);panY=pinch.panY+(cy-pinch.cy);zoom=nz;setWorld();e.preventDefault();return}
 if(stageDrag&&stageDrag.id===e.pointerId){stageDrag.el.style.left=(stageDrag.left+(e.clientX-stageDrag.x)/zoom)+'px';stageDrag.el.style.top=(stageDrag.top+(e.clientY-stageDrag.y)/zoom)+'px';e.preventDefault()}
});
function endPointer(e){touches.delete(e.pointerId);if(touches.size<2)pinch=null;if(stageDrag&&stageDrag.id===e.pointerId)stageDrag=null}
stage.addEventListener('pointerup',endPointer);stage.addEventListener('pointercancel',endPointer);

 }catch(err){alert('앱 카메라를 열 수 없어요. 카메라 권한을 허용한 뒤 다시 눌러 주세요.');closeCam()}
