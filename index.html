<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>화장수리 · 새 시작</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#fff;color:#252125}
#app{height:100dvh;display:grid;grid-template-rows:64px 1fr;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid #eee}
header button{height:44px;border:0;border-radius:13px;background:#fff0f5;font-weight:700;font-size:14px;color:#b64e72}
main{min-height:0;display:grid;place-items:center;padding:12px;background:#faf7f8}
.stage{position:relative;width:min(calc(100vw - 24px),calc((100dvh - 88px)*.8));aspect-ratio:4/5;max-height:100%;border-radius:18px;overflow:hidden;background:#eee8ea}
#photo{width:100%;height:100%;object-fit:cover;display:none}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#94878c;font-size:14px;line-height:1.6}
.cam{position:fixed;inset:0;z-index:100;background:#000;display:none}
.cam.show{display:block}
.cam video{width:100%;height:100%;object-fit:cover}
.close{position:absolute;top:calc(18px + env(safe-area-inset-top));left:16px;border:0;border-radius:20px;padding:9px 13px;background:#0008;color:#fff;font-size:14px}
.shot{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);width:70px;height:70px;border-radius:50%;border:6px solid #ffffff88;background:#fff}
</style>
</head>
<body>
<div id="app">
<header>
<button id="camera">📷 사진 찍기</button>
<button id="gallery">🖼️ 사진 불러오기</button>
<input id="galleryInput" type="file" accept="image/*" hidden>
</header>
<main>
<div class="stage">
<img id="photo" alt="">
<div class="empty" id="empty">사진을 찍거나<br>사진을 불러오세요</div>
</div>
</main>
</div>
<div class="cam" id="cam">
<video id="video" autoplay playsinline muted></video>
<button class="close" id="close">닫기</button>
<button class="shot" id="shot" aria-label="촬영"></button>
<canvas id="canvas" hidden></canvas>
</div>
<script>
const $=s=>document.querySelector(s);
const photo=$('#photo'), empty=$('#empty'), input=$('#galleryInput');
let stream=null;
function showPhoto(src){
 photo.onload=()=>{photo.style.display='block';empty.style.display='none'};
 photo.src=src;
}
$('#gallery').onclick=()=>input.click();
input.onchange=e=>{
 const f=e.target.files&&e.target.files[0];
 if(!f)return;
 showPhoto(URL.createObjectURL(f));
};
async function openCamera(){
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  $('#cam').classList.add('show');
  $('#video').srcObject=stream;
  await $('#video').play();
 }catch(e){
  alert('카메라 권한을 허용한 뒤 다시 눌러 주세요.');
 }
}
function closeCamera(){
 $('#cam').classList.remove('show');
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
}
$('#camera').onclick=openCamera;
$('#close').onclick=closeCamera;
$('#shot').onclick=()=>{
 const v=$('#video'),c=$('#canvas');
 if(!v.videoWidth)return;
 c.width=v.videoWidth;c.height=v.videoHeight;
 c.getContext('2d').drawImage(v,0,0);
 c.toBlob(blob=>{if(blob){showPhoto(URL.createObjectURL(blob));closeCamera()}},'image/jpeg',.95);
};
</script>
</body>
</html>
