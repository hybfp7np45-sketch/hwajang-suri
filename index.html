<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>화장수리 V3</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#fff7fa;color:#2b2427}button{font:inherit}
#app{width:100vw;height:100dvh;display:grid;grid-template-rows:58px minmax(0,1fr) 72px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;gap:8px;align-items:center;padding:8px 14px;background:#fff;border-bottom:1px solid #f1e5e9;z-index:30}.ico{width:42px;height:42px;border:0;border-radius:13px;background:#fff0f5;font-size:20px}.save{margin-left:auto}
main{position:relative;min-height:0;display:flex;justify-content:center;align-items:center;padding:8px;overflow:hidden}#stage{position:relative;width:min(calc(100vw - 16px),calc((100dvh - 146px)*.8));aspect-ratio:4/5;max-height:100%;background:#eee7ea;overflow:hidden;border-radius:16px;touch-action:none}#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#998b91}
.brow{position:absolute;width:19%;height:5.2%;top:29%;touch-action:none;transform-origin:center;display:none}.brow.left{left:30.5%}.brow.right{right:30.5%}.brow svg{width:100%;height:100%;overflow:visible}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #f1e5e9;z-index:35}nav button{border:0;background:#fff;font-size:13px}.active{color:#cf527b;font-weight:700}
#sheet{position:absolute;z-index:25;left:0;right:0;bottom:0;height:0;overflow:hidden;background:rgba(255,255,255,.96);border-radius:20px 20px 0 0;box-shadow:0 -8px 24px #0001;transition:height .18s}#sheet.open{height:168px}.handle{width:42px;height:5px;background:#ddd;border-radius:8px;margin:8px auto}.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:7px 9px}.preset{height:78px;border:1px solid #f0dce3;border-radius:13px;background:#fff8fa;padding:3px}.preset svg{width:100%;height:49px}.preset small{display:block;text-align:center;font-size:11px}
</style></head><body><div id="app"><header><button class="ico" id="cam">📷</button><button class="ico" id="gal" aria-label="사진첩">🖼️</button><button class="ico save" id="save">⇩</button><input id="camIn" type="file" accept="image/*" capture="environment" hidden><input id="galIn" type="file" accept="image/*" hidden></header><main><div id="stage"><img id="photo"><div id="empty">사진을 촬영하거나<br>사진첩에서 불러오세요</div><div class="brow left" id="left"></div><div class="brow right" id="right"></div></div><div id="sheet"><div class="handle"></div><div class="presets" id="presets"></div></div></main><nav><button class="active" id="browTab">눈썹</button><button>입술</button><button>아이라인</button><button>헤어라인</button></nav></div><script>
const $=s=>document.querySelector(s),photo=$('#photo'),sheet=$('#sheet'),L=$('#left'),R=$('#right');
function brow(side='L',v=0){let p=[];for(let i=0;i<36;i++){let t=i/35,x=3+t*114;let base=45-17*Math.sin(Math.PI*Math.pow(t,.82));let len=(i<7?18+i*1.1:24-12*t);let lean=i<7?2+i*.7:i<24?8-2*t:5-4*(t-.68)/.32;let top=base-len;let cx=x+lean*.48;let cy=base-len*.58;p.push('<path d="M'+x.toFixed(1)+' '+base.toFixed(1)+' Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+(x+lean).toFixed(1)+' '+top.toFixed(1)+'" fill="none" stroke="#584139" stroke-width="'+(0.75+0.6*Math.sin(t*Math.PI)).toFixed(2)+'" stroke-linecap="round" opacity="'+(0.48+0.34*Math.sin(t*Math.PI)).toFixed(2)+'"/>')}let s='<svg viewBox="0 0 120 60" preserveAspectRatio="none">'+p.join('')+'</svg>';return side==='L'?s:s.replace('<svg ','<svg style="transform:scaleX(-1)" ')}
const names=['참고패턴','소프트','스트레이트','아치'];names.forEach((n,i)=>$('#presets').insertAdjacentHTML('beforeend','<button class="preset" data-i="'+i+'">'+brow('L',i)+'<small>'+n+'</small></button>'));
function setPreset(i){L.innerHTML=brow('L',i);R.innerHTML=brow('R',i);[L,R].forEach(x=>{x.style.display='block';x.dataset.v='0,0,1,0';x.style.transform=''})}
$('#presets').onclick=e=>{let b=e.target.closest('.preset');if(b)setPreset(+b.dataset.i)};
$('#cam').onclick=()=>$('#camIn').click();$('#gal').onclick=async()=>{try{if(window.showOpenFilePicker){const [h]=await showOpenFilePicker({types:[{description:'사진',accept:{'image/*':['.jpg','.jpeg','.png','.heic','.webp']}}],multiple:false});const f=await h.getFile();load(f)}else{$('#galIn').click()}}catch(e){}};function load(f){if(!f)return;photo.src=URL.createObjectURL(f);photo.style.display='block';$('#empty').style.display='none';L.style.display=R.style.display='none'}$('#camIn').onchange=e=>load(e.target.files[0]);$('#galIn').onchange=e=>load(e.target.files[0]);$('#browTab').onclick=()=>sheet.classList.toggle('open');
function gestures(el){let pts={},start={};function vals(){return(el.dataset.v||'0,0,1,0').split(',').map(Number)}function apply(v){el.dataset.v=v.join(',');el.style.transform='translate('+v[0]+'px,'+v[1]+'px) scale('+v[2]+') rotate('+v[3]+'deg)'}el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);pts[e.pointerId]=[e.clientX,e.clientY];start={p:JSON.parse(JSON.stringify(pts)),v:vals()}};el.onpointermove=e=>{if(!pts[e.pointerId])return;pts[e.pointerId]=[e.clientX,e.clientY];let a=Object.values(pts),b=Object.values(start.p),v=start.v.slice();if(a.length===1){v[0]+=a[0][0]-b[0][0];v[1]+=a[0][1]-b[0][1]}else{let d0=Math.hypot(b[1][0]-b[0][0],b[1][1]-b[0][1]),d=Math.hypot(a[1][0]-a[0][0],a[1][1]-a[0][1]);v[2]=Math.max(.35,Math.min(2.5,v[2]*d/d0));v[3]+=(Math.atan2(a[1][1]-a[0][1],a[1][0]-a[0][0])-Math.atan2(b[1][1]-b[0][1],b[1][0]-b[0][0]))*180/Math.PI}apply(v)};el.onpointerup=el.onpointercancel=e=>delete pts[e.pointerId]}gestures(L);gestures(R);
$('#save').onclick=()=>alert('저장 기능도 이어서 연결 중입니다.');
</script></body></html>
