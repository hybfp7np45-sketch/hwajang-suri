<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>화장수리 | 기존 눈썹 분리 실험</title><style>
*{box-sizing:border-box}html,body{height:auto!important;min-height:100%;overflow-y:auto!important;overscroll-behavior-y:auto}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4fbff;color:#263944}header{padding:14px 16px;background:white;border-bottom:1px solid #d8eaf5;font-weight:700}main{max-width:650px;margin:auto;padding:12px}p{font-size:13px;line-height:1.6;color:#587080}button,.upload{border:1px solid #acd8ee;background:white;color:#286c8d;padding:11px 12px;border-radius:12px;font-weight:650;font-size:13px;cursor:pointer}button.active{background:#bde8fa}input[type=file]{display:none}.bar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.bar>*{flex:1;text-align:center;white-space:nowrap}#viewport{height:45vh;min-height:240px!important;max-height:430px;position:relative;width:100%;background:#e1eaf0;border-radius:14px;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center}canvas{display:block;max-width:100%;max-height:43vh;touch-action:none}label{font-size:13px}input[type=range]{width:100%}.control{position:relative;z-index:3;padding:10px 12px;background:white;border-radius:12px;margin:10px 0}.hint{font-size:12px;color:#667f8b}#status{font-size:12px;min-height:24px;color:#28759d}.small{font-size:11px}</style><style id="fixed-mobile-layout">
html,body{height:100%!important;overflow:hidden!important;margin:0!important}
body{display:flex!important;flex-direction:column!important}
header{flex:0 0 auto!important;padding:9px 13px!important}
main{flex:1 1 0!important;min-height:0!important;width:100%!important;max-width:650px!important;margin:0 auto!important;display:flex!important;flex-direction:column!important;padding:7px 10px calc(env(safe-area-inset-bottom,0px) + 7px)!important;overflow:hidden!important}
main>p:first-child{display:none!important}
main>.bar:first-of-type{flex:0 0 auto!important;margin:4px 0 6px!important}
#viewport{contain:layout paint!important;user-select:none!important;-webkit-user-select:none!important;overscroll-behavior:none!important;height:auto!important;min-height:0!important;max-height:none!important;flex:1 1 0!important;overflow:hidden!important;touch-action:none!important}
#screen{pointer-events:none!important;backface-visibility:hidden!important;max-height:100%!important;max-width:100%!important;object-fit:contain!important}
#controlsDock{flex:0 0 auto!important;max-height:43vh!important;min-height:205px!important;overflow-y:auto!important;overflow-x:hidden!important;overscroll-behavior:contain!important;-webkit-overflow-scrolling:touch!important;background:#f4fbff!important;touch-action:pan-y!important;padding-bottom:12px!important}
#controlsDock .control{margin:5px 0!important;padding:8px 10px!important}
#controlsDock .bar{margin:6px 0!important}
#controlsDock button,#controlsDock input{touch-action:manipulation!important;pointer-events:auto!important}
#controlsDock input[type=range]{touch-action:none!important;display:block!important;height:30px!important;position:relative!important;z-index:10!important}
#controlsDock .hint{font-size:11px!important}
#controlsDock p.small{margin:5px 0!important}
</style></head><body><header>화장수리 · 기존 눈썹 분리 실험 01</header><main><p>고객 사진을 불러와 <b>눈썹 털이 있는 부분만</b> 브러시로 지정해 봐. 지정한 영역에서 어두운 선을 추출해 별도 투명 레이어로 미리 보여줘. <b>원본 사진은 변경하지 않아.</b></p><div class="bar"><label class="upload">사진 불러오기<input id="file" type="file" accept="image/*"></label><button id="move">사진 이동</button><button id="paint" class="active">영역 선택</button><button id="erase">선택 지우기</button><button id="clear">초기화</button></div><div id="viewport"><canvas id="screen"></canvas></div><div class="control"><label>브러시 크기 <span id="brushValue">24</span></label><input id="brush" type="range" min="5" max="100" value="24"><label>털 추출 강도 <span id="thresholdValue">45</span></label><input id="threshold" type="range" min="5" max="95" value="45"><div class="hint">강도를 높이면 더 많은 어두운 픽셀이 털로 선택돼. 반영구 잔흔도 함께 선택될 수 있어.</div></div><div class="bar" id="views"><button id="original" class="active">원본 + 선택</button><button id="hair">털 레이어만</button><button id="composite">원본 + 털 강조</button></div><div class="bar"><button id="save">털 레이어 PNG 저장</button><button id="undo">선택 되돌리기</button></div><div id="status">사진을 불러와 줘.</div><p class="small">1차 검증용: 색상·명암 기반 분리이므로 털과 비슷한 색의 잔흔을 완벽히 구별하지 못해. 실제 AI 털 인식 및 피부 복원 기능은 다음 단계야.</p></main><script>
const $=s=>document.querySelector(s),screen=$('#screen'),ctx=screen.getContext('2d',{willReadFrequently:true});let source=null,mask=null,mode='paint',view='original',drawing=false,prev=null,history=[],activePointer=null,pinch=null,zoom=1,panX=0,panY=0;const touches=new Map();const brush=$('#brush'),threshold=$('#threshold'),viewport=$('#viewport');let frame=0,dirty=true,hairCache=null;let fullImage=null,fullW=0,fullH=0,photoCanvas=null;
function load(file){if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{fullW=img.naturalWidth;fullH=img.naturalHeight;fullImage=img;const scale=Math.min(1,2400/Math.max(fullW,fullH));screen.width=Math.round(fullW*scale);screen.height=Math.round(fullH*scale);photoCanvas=document.createElement('canvas');photoCanvas.width=screen.width;photoCanvas.height=screen.height;const pc=photoCanvas.getContext('2d',{willReadFrequently:true});pc.imageSmoothingEnabled=true;pc.imageSmoothingQuality='high';pc.drawImage(img,0,0,screen.width,screen.height);source=pc.getImageData(0,0,screen.width,screen.height);zoom=1;panX=0;panY=0;applyTransform();mask=new Uint8Array(screen.width*screen.height);history=[];dirty=true;render();$('#status').textContent='원본 '+fullW+'×'+fullH+' / 작업 '+screen.width+'×'+screen.height+' · 확대 후 눈썹 영역을 칠해 줘.';URL.revokeObjectURL(url)};img.src=url}
$('#file').onchange=e=>load(e.target.files[0]);brush.oninput=()=>$('#brushValue').textContent=brush.value;threshold.oninput=()=>{$('#thresholdValue').textContent=threshold.value;dirty=true;scheduleRender()};
function applyTransform(){screen.style.imageRendering='auto';screen.style.transform='translate3d('+panX+'px,'+panY+'px,0) scale('+zoom+')';screen.style.transformOrigin='center center'}
function point(e){const r=screen.getBoundingClientRect();return{x:(e.clientX-r.left)*screen.width/r.width,y:(e.clientY-r.top)*screen.height/r.height}}
function dab(x,y){if(!mask)return;const rad=+brush.value/2,w=screen.width,h=screen.height;for(let py=Math.max(0,Math.floor(y-rad));py<Math.min(h,Math.ceil(y+rad));py++)for(let px=Math.max(0,Math.floor(x-rad));px<Math.min(w,Math.ceil(x+rad));px++)if(Math.hypot(px-x,py-y)<=rad)mask[py*w+px]=mode==='paint'?255:0;dirty=true}
function stroke(a,b){const d=Math.hypot(a.x-b.x,a.y-b.y),n=Math.max(1,Math.ceil(d/4));for(let i=0;i<=n;i++)dab(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n)}
function scheduleRender(){if(frame)return;frame=requestAnimationFrame(()=>{frame=0;render()})}
function midpoint(){const a=[...touches.values()].slice(0,2);return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.max(1,Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y))}}
function beginPinch(){if(touches.size<2)return;if(drawing&&history.length){mask=history.pop();dirty=true;scheduleRender()}drawing=false;activePointer=null;prev=null;pinch=midpoint()}
viewport.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
viewport.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
viewport.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
viewport.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
viewport.addEventListener('pointerdown',e=>{if(!source)return;e.preventDefault();e.stopPropagation();viewport.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){beginPinch();return}if(touches.size!==1||pinch)return;activePointer=e.pointerId;prev=point(e);drawing=mode!=='move';if(drawing){history.push(mask.slice());if(history.length>15)history.shift();dab(prev.x,prev.y);scheduleRender()}});
viewport.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;e.preventDefault();e.stopPropagation();const old=touches.get(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size>=2){if(!pinch)beginPinch();const now=midpoint(),ratio=Math.max(.5,Math.min(2,now.d/pinch.d)),newZoom=Math.max(1,Math.min(10,zoom*ratio));const actualRatio=newZoom/zoom;const box=viewport.getBoundingClientRect(),cx=pinch.x-box.left-box.width/2,cy=pinch.y-box.top-box.height/2;panX+=(now.x-pinch.x)+(1-actualRatio)*(cx-panX);panY+=(now.y-pinch.y)+(1-actualRatio)*(cy-panY);zoom=newZoom;pinch=now;applyTransform();return}if(pinch||activePointer!==e.pointerId)return;if(mode==='move'){panX+=e.clientX-old.x;panY+=e.clientY-old.y;applyTransform();return}if(!drawing)return;const p=point(e);stroke(prev,p);prev=p;scheduleRender()});
function finish(e){touches.delete(e.pointerId);if(e.pointerId===activePointer){drawing=false;activePointer=null;prev=null}if(touches.size<2&&pinch){pinch=null;drawing=false;activePointer=null;prev=null}}
viewport.addEventListener('pointerup',finish);viewport.addEventListener('pointercancel',finish);
function extract(){const out=new ImageData(screen.width,screen.height);if(!source)return out;const s=source.data,d=out.data,w=screen.width,h=screen.height,t=+threshold.value/100;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const p=y*w+x;if(!mask[p])continue;const i=p*4,r=s[i],g=s[i+1],b=s[i+2];const lum=.299*r+.587*g+.114*b;let neighbor=0,count=0;for(let dy=-3;dy<=3;dy+=3)for(let dx=-3;dx<=3;dx+=3){const k=((y+dy)*w+x+dx)*4;neighbor+=.299*s[k]+.587*s[k+1]+.114*s[k+2];count++}neighbor/=count;const contrast=Math.max(0,neighbor-lum);const darkness=Math.max(0,(180-lum)/180);const strength=Math.max(0,Math.min(1,(contrast/48*.75+darkness*.35-(1-t)*.75)*2));d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=Math.round(strength*mask[p])}return out}
function render(){if(!source)return;ctx.clearRect(0,0,screen.width,screen.height);const hair=view==='original'?null:(dirty||!hairCache?(hairCache=extract(),dirty=false,hairCache):hairCache);if(view==='hair'){ctx.fillStyle='#e9eef1';ctx.fillRect(0,0,screen.width,screen.height);const layer=document.createElement('canvas');layer.width=screen.width;layer.height=screen.height;layer.getContext('2d').putImageData(hair,0,0);ctx.drawImage(layer,0,0);$('#status').textContent='털 레이어만 표시 중 · 선택된 부분이 없다면 강도를 올리거나 눈썹을 다시 칠해 줘.';return}ctx.drawImage(photoCanvas,0,0);if(view==='composite'){const c=document.createElement('canvas');c.width=screen.width;c.height=screen.height;c.getContext('2d').putImageData(hair,0,0);ctx.globalAlpha=.8;ctx.drawImage(c,0,0);ctx.globalAlpha=1;return}const d=ctx.getImageData(0,0,screen.width,screen.height);for(let i=0;i<mask.length;i++)if(mask[i]){const k=i*4,a=.28;d.data[k]=d.data[k]*(1-a)+56*a;d.data[k+1]=d.data[k+1]*(1-a)+177*a;d.data[k+2]=d.data[k+2]*(1-a)+232*a}ctx.putImageData(d,0,0)}
for(const id of ['move','paint','erase'])$('#'+id).onclick=()=>{mode=id;$('#move').classList.toggle('active',id==='move');$('#paint').classList.toggle('active',id==='paint');$('#erase').classList.toggle('active',id==='erase')};for(const id of ['original','hair','composite'])$('#'+id).onclick=()=>{view=id;for(const k of ['original','hair','composite'])$('#'+k).classList.toggle('active',id===k);render();};$('#clear').onclick=()=>{if(!mask)return;history.push(mask.slice());mask.fill(0);dirty=true;render()};$('#undo').onclick=()=>{if(!history.length)return;mask=history.pop();dirty=true;render()};$('#save').onclick=()=>{if(!source)return;const c=document.createElement('canvas');c.width=screen.width;c.height=screen.height;c.getContext('2d').putImageData(extract(),0,0);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='hwajang-suri-eyebrow-hair-layer.png';a.click()};
</script><script id="dock-setup">
(function(){
const main=document.querySelector('main'),viewport=document.getElementById('viewport'),control=main.querySelector('.control');
if(!main||!viewport||!control)return;
const dock=document.createElement('section');dock.id='controlsDock';control.parentNode.insertBefore(dock,control);
let el=control;while(el){const next=el.nextElementSibling;dock.appendChild(el);el=next}
const status=document.getElementById('status');if(status)status.textContent='브러시 조절 패널을 아래에 고정했어. 사진 확대는 위쪽에서 두 손가락으로 해 줘.';
})();
</script></body></html>
