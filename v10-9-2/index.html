<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>화장수리 V10.9.2</title><style>html,body,iframe{margin:0;border:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block}</style></head><body><iframe id="app" src="../v10-9-1/index.html"></iframe><script>const f=document.getElementById('app');f.onload=async()=>{try{const b64=(await fetch('./signature-shadow1.b64?cb=e2c8b329')).text();const raw='data:image/webp;base64,'+b64.trim();
const img=new Image(); img.src=raw; await img.decode();
const cv=document.createElement('canvas'); cv.width=img.naturalWidth; cv.height=img.naturalHeight;
const cx=cv.getContext('2d'); cx.drawImage(img,0,0);
const id=cx.getImageData(0,0,cv.width,cv.height);
for(let y=0;y<cv.height;y++)for(let x=0;x<4;x++)id.data[(y*cv.width+x)*4+3]=0;
cx.putImageData(id,0,0); const shadow=cv.toDataURL('image/png');
f.contentWindow.eval(`browAssets['시그니처 · 섀도우1']=${JSON.stringify(shadow)};const _oldAddBrow=addBrow;addBrow=function(o){if(o&&o.name==='시그니처 · 섀도우1'){o={...o,flip:false,imgScale:1}}return _oldAddBrow(o)};showTech=function(design){rail.innerHTML='';const techs=design==='시그니처'?['시그니처 · 엠보1','시그니처 · 헤스1','시그니처 · 섀도우1']:design==='아치형'?['아치 · 엠보','아치 · 헤스','아치 · 섀도우']:[];if(!techs.length){rail.style.display='none';S.className='sheet level2';return}rail.style.display='flex';S.className='sheet level3';techs.forEach(n=>{const flip=n==='아치 · 섀도우'?'transform:scale(.88) scaleX(-1);':'';rail.insertAdjacentHTML('beforeend','<button class="card tech-card" data-name="'+n+'"><div class="mini"><img src="'+browAssets[n]+'" style="width:100%;height:100%;object-fit:contain;'+flip+'"></div><small>'+n.split(' · ')[1]+'</small></button>')})}rail.onclick=e=>{const c=e.target.closest('.tech-card');if(!c)return;if(!P.src)return alert('먼저 사진을 불러와 주세요.');const n=c.dataset.name;const isSigShadow=n==='시그니처 · 섀도우1';addBrow({name:n,src:browAssets[n],flip:isSigShadow?false:n.includes('섀도우'),ratio:330/700,imgScale:isSigShadow?1:(n.includes('섀도우')?.88:1)})};`)}catch(e){console.error(e)}};</script></body></html>
