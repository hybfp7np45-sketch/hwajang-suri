<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Face Studio 눈 합성 테스트</title><style>*{box-sizing:border-box}body{margin:0;background:#edf6fa;font:14px -apple-system,BlinkMacSystemFont,sans-serif;color:#29465c}.app{max-width:550px;margin:auto;min-height:100vh;padding:18px;background:#f9fcff}h1{font-size:20px;margin:0 0 5px}.hint{font-size:12px;color:#718d9e;line-height:1.6}.stage{position:relative;background:#e5f0f6;border-radius:16px;overflow:hidden;margin:14px 0;min-height:280px;display:grid;place-items:center}.stage canvas{display:block;width:100%;height:auto}.stage p{padding:70px 12px;color:#7892a0}.row{display:flex;gap:8px;align-items:center;margin:12px 0}label.btn,button{background:#dceef9;color:#2c7196;border:0;border-radius:10px;padding:12px 10px;font-size:13px;cursor:pointer;text-align:center}label.btn{flex:1}input[type=file]{display:none}.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:12px 0}.slot{position:relative;border:2px solid #c6e1f0;border-radius:10px;background:#e8f3fa;aspect-ratio:1;overflow:hidden;padding:0}.slot.active{border:3px solid #2e9fdb}.slot canvas{width:100%;height:100%;object-fit:cover}.slot span{font-size:11px}.slot .num{position:absolute;top:2px;left:3px;background:#ffffffbb;border-radius:4px;padding:1px 3px}.slot .add{font-size:22px}.status{font-size:12px;min-height:32px;color:#46738c}.controls{display:flex;gap:7px}.controls button{flex:1}.primary{background:#4aa7d9;color:white}.foot{font-size:11px;color:#718d9e;line-height:1.6}</style></head><body><main class="app"><h1>FACE STUDIO · 눈 합성</h1><div class="hint">고객 사진 1장과 눈 참고 사진 최대 5장을 등록하세요. 네모칸을 누르면 실제 사진의 눈 영역을 가져와 합성합니다.</div><div class="row"><label class="btn">고객 사진 불러오기<input id="customer" type="file" accept="image/*"></label><label class="btn">선택한 칸에 눈 사진 넣기<input id="reference" type="file" accept="image/*"></label></div><div class="stage" id="stage"><p id="placeholder">고객 얼굴 사진을 불러와 주세요</p><canvas id="output" hidden></canvas></div><div class="slots" id="slots"></div><div class="status" id="status">눈 사진 칸을 선택한 다음 참고 사진을 넣으세요.</div><div class="controls"><button id="before">원본 보기</button><button id="reset">합성 초기화</button><button class="primary" id="save">결과 저장</button></div><p class="foot">첫 테스트: 얼굴이 정면에 가까운 사진을 권장합니다. 합성은 기기에서 처리되며 사진은 서버로 전송하지 않습니다. 조명과 각도가 다르면 경계가 보일 수 있습니다.</p></main><script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script><script>
const $=id=>document.getElementById(id), slots=$('slots'), out=$('output'),ctx=out.getContext('2d'),refs=Array(5).fill(null);let base=null,basePoints=null,chosen=0,showBefore=false,mesh=null,queue=Promise.resolve();
const eyeSets=[[33,160,158,133,153,144],[362,385,387,263,373,380]];
for(let i=0;i<5;i++){const b=document.createElement('button');b.className='slot'+(i===0?' active':'');b.innerHTML='<span class="num">'+(i+1)+'</span><span class="add">+</span>';b.onclick=()=>{chosen=i;document.querySelectorAll('.slot').forEach((n,j)=>n.classList.toggle('active',j===i));if(refs[i])render();else $('status').textContent=(i+1)+'번 칸에 참고 얼굴 사진을 넣어주세요.'};slots.append(b)}
function status(s){$('status').textContent=s}
function load(file){return new Promise((resolve,reject)=>{if(!file)return reject(Error('사진을 선택하지 않았습니다'));const u=URL.createObjectURL(file),im=new Image;im.onload=()=>{URL.revokeObjectURL(u);resolve(im)};im.onerror=()=>reject(Error('사진을 읽을 수 없습니다'));im.src=u})}
async function detect(img){if(!mesh){if(!window.FaceMesh)throw Error('얼굴 인식 라이브러리를 불러오지 못했습니다');mesh=new FaceMesh({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/'+f});mesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:.55,staticImageMode:true})}return new Promise(async(resolve,reject)=>{let settled=false;mesh.onResults(r=>{if(!settled){settled=true;resolve(r.multiFaceLandmarks?.[0]||null)}});try{await mesh.send({image:img});if(!settled){settled=true;resolve(null)}}catch(e){reject(e)}})}
function enqueue(fn){queue=queue.catch(()=>{}).then(fn);return queue}
function canvasOf(img){const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);return c}
function bounds(points,ids,w,h){const ps=ids.map(i=>({x:points[i].x*w,y:points[i].y*h}));return {x:Math.min(...ps.map(p=>p.x)),y:Math.min(...ps.map(p=>p.y)),w:Math.max(...ps.map(p=>p.x))-Math.min(...ps.map(p=>p.x)),h:Math.max(...ps.map(p=>p.y))-Math.min(...ps.map(p=>p.y))}}
function render(){if(!base)return;out.hidden=false;$('placeholder').hidden=true;out.width=base.naturalWidth;out.height=base.naturalHeight;ctx.clearRect(0,0,out.width,out.height);ctx.drawImage(base,0,0);const ref=refs[chosen];if(showBefore||!ref||!basePoints)return;const source=canvasOf(ref.img);for(const ids of eyeSets){const a=bounds(ref.points,ids,source.width,source.height),b=bounds(basePoints,ids,out.width,out.height);const sw=a.w*1.6,sh=a.h*2.2,dw=b.w*1.6,dh=b.h*2.2;if(sw<2||sh<2||dw<2||dh<2)continue;const cut=document.createElement('canvas');cut.width=Math.max(2,Math.ceil(dw));cut.height=Math.max(2,Math.ceil(dh));const c=cut.getContext('2d');c.drawImage(source,a.x+a.w/2-sw/2,a.y+a.h/2-sh/2,sw,sh,0,0,cut.width,cut.height);c.globalCompositeOperation='destination-in';const g=c.createRadialGradient(cut.width/2,cut.height/2,cut.width*.14,cut.width/2,cut.height/2,Math.max(cut.width,cut.height)*.58);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,cut.width,cut.height);ctx.drawImage(cut,b.x+b.w/2-dw/2,b.y+b.h/2-dh/2,dw,dh)}}
function thumbnail(i){const r=refs[i];const b=slots.children[i];b.innerHTML='<span class="num">'+(i+1)+'</span>';const c=document.createElement('canvas');c.width=160;c.height=100;const g=c.getContext('2d');g.fillStyle='#e6f2f9';g.fillRect(0,0,160,100);eyeSets.forEach((ids,j)=>{const a=bounds(r.points,ids,r.img.width,r.img.height);g.drawImage(r.img,a.x-a.w*.3,a.y-a.h*.8,a.w*1.6,a.h*2.6,j*80,0,80,100)});b.append(c)}
$('customer').onchange=e=>enqueue(async()=>{try{status('고객 얼굴 인식 중...');base=await load(e.target.files[0]);basePoints=await detect(base);if(!basePoints)throw Error('고객 사진에서 얼굴을 찾지 못했습니다. 정면 사진을 사용해 주세요.');render();status('고객 얼굴 인식 완료. 눈 사진을 선택하세요.')}catch(err){status(err.message)}})
$('reference').onchange=e=>enqueue(async()=>{try{status('참고 사진에서 눈 인식 중...');const img=await load(e.target.files[0]);const points=await detect(img);if(!points)throw Error('참고 사진에서 얼굴을 찾지 못했습니다.');refs[chosen]={img,points};thumbnail(chosen);showBefore=false;render();status((chosen+1)+'번 눈 합성 완료. 다른 칸을 누르면 눈을 바꿀 수 있습니다.')}catch(err){status(err.message)}e.target.value=''})
$('before').onclick=()=>{showBefore=!showBefore;$('before').textContent=showBefore?'합성 보기':'원본 보기';render()}
$('reset').onclick=()=>{showBefore=true;$('before').textContent='합성 보기';render();status('원본으로 복원했습니다.')}
$('save').onclick=()=>{if(!base){status('고객 사진을 먼저 넣어주세요.');return}const a=document.createElement('a');a.href=out.toDataURL('image/png');a.download='face-studio-eye-test.png';a.click()}
</script></body></html>
