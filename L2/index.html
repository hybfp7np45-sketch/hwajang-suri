const paletteKey='suri.L2.myPalette.v1';try{if(localStorage.getItem(paletteKey)===null){const previous=localStorage.getItem('suri.L1.myPalette.v1');if(previous)localStorage.setItem(paletteKey,previous)}}catch(e){}let myColors=[],draft=[],sampling=false,makerURL=null;
try{const v=JSON.parse(localStorage.getItem(paletteKey)||'[]');if(Array.isArray(v))myColors=v.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&/^#[0-9a-f]{6}$/i.test(x.hex))}catch(e){}
function syncMyPalette(){lipProfileCache.clear();for(const key of Object.keys(palettes)){palettes[key]=myColors.map(x=>[x.name,x.hex]);if(Number.isInteger(selected[key])&&selected[key]>=0)selected[key]=myColors.length?Math.min(selected[key],myColors.length-1):null}render()}
function drawCatalog(){
 const catalog=$('catalog'),scroll=catalog.scrollTop;
 catalog.replaceChildren();
 for(const [brand,label] of [['perma','Perma Blend (펄마)'],['tina','Tina Davies (티나 데이비스)'],['evenflo','Evenflo (이븐플로)'],['luxe','LUXE (럭스)']]){
  const title=document.createElement('h2');title.className='catalog-brand';title.textContent=label;catalog.append(title);
  pigmentCatalog.filter(x=>x.brand===brand).forEach(x=>{
   const button=makeColorButton(x.name,x.hex,draft.some(c=>c.id===x.id));button.title=x.name;
   button.onclick=()=>{const i=draft.findIndex(c=>c.id===x.id);if(i<0)draft.push({...x});else draft.splice(i,1);drawCatalog()};
   catalog.append(button);
  });
 }
 catalog.scrollTop=scroll;
 $('picked').replaceChildren();
 draft.forEach((x,i)=>{const button=makeColorButton(x.name,x.hex);button.onclick=()=>{draft.splice(i,1);drawCatalog()};$('picked').append(button)});
}
$('openPalette').onclick=()=>{draft=myColors.map(x=>({...x}));$('paletteBuilder').hidden=false;$('paletteStatus').textContent='';drawCatalog()};$('brandFilter').onchange=drawCatalog;$('closePalette').onclick=()=>{$('paletteBuilder').hidden=true};
$('applyPalette').onclick=()=>{try{localStorage.setItem(paletteKey,JSON.stringify(draft))}catch(e){$('paletteStatus').textContent='저장 공간을 확인해 주세요. 팔레트를 저장하지 못했어요.';return}myColors=draft.map(x=>({...x}));syncMyPalette();$('paletteBuilder').hidden=true};
function stopSampling(){sampling=false;document.body.classList.remove('sampling');$('sampleColor').setAttribute('aria-pressed','false')}
function closeMaker(){stopSampling();$('customMaker').hidden=true;$('paletteBuilder').hidden=false;drawCatalog()}
$('openMaker').onclick=()=>{$('paletteBuilder').hidden=true;$('customMaker').hidden=false};$('closeMaker').onclick=closeMaker;
function setCustomColor(hex){$('customColor').value=hex;$('customHex').value=hex}
