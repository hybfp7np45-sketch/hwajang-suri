<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>화장수리 V10.9.3</title><style>html,body,iframe{margin:0;border:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block}</style></head><body><iframe id="app" src="../v10-9-1/index.html?base=no-shadow-1093"></iframe><script>const f=document.getElementById('app');f.onload=async()=>{try{f.contentWindow.eval(`showTech=function(design){rail.innerHTML='';const techs=design==='시그니처'?['시그니처 · 엠보1','시그니처 · 헤스1']:design==='아치형'?['아치 · 엠보','아치 · 헤스','아치 · 섀도우']:[];if(!techs.length){rail.style.display='none';S.className='sheet level2';return}rail.style.display='flex';S.className='sheet level3';techs.forEach(n=>{const flip=n==='아치 · 섀도우'?'transform:scale(.88) scaleX(-1);':'';rail.insertAdjacentHTML('beforeend','<button class="card tech-card" data-name="'+n+'"><div class="mini"><img src="'+browAssets[n]+'" style="width:100%;height:100%;object-fit:contain;'+flip+'"></div><small>'+n.split(' · ')[1]+'</small></button>')})}rail.onclick=e=>{const c=e.target.closest('.tech-card');if(!c)return;if(!P.src)return alert('먼저 사진을 불러와 주세요.');const n=c.dataset.name;addBrow({name:n,src:browAssets[n],flip:n.includes('섀도우'),ratio:330/700,imgScale:n.includes('섀도우')?.88:1})};`)}catch(e){console.error(e)}};</script></body></html>
