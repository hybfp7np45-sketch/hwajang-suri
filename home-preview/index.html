px solid #e7eff4;border-radius:16px;padding:23px 10px;text-align:center;font-size:14px;color:#526e81}.item span{display:block;font-size:26px;margin-bottom:10px}</style></head><body><main class="app"><header><span>화장수리</span></header><section class="hero"><div class="banner-content"><div class="banner-photo" aria-hidden="true"></div><div class="banner-copy"><strong>가장 어울리는<br><em>디자인과 컬러</em>를<br>미리 만나보세요.</strong><p>간단한 시뮬레이션으로<br>더 특별한 나를 경험하세요.</p></div></div></section><nav class="cards"><a class="card brow" href="https://hybfp7np45-sketch.github.io/hwajang-suri/v18.8/index.html?v=0bb2abf3"><span class="card-photo" aria-hidden="true"></span><span class="label"><strong>눈썹 디자인<br>미리 보기</strong><small>BROW PREVIEW</small></span><span class="arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></span></a><a class="card lip" href="#" onclick="alert('입술 컬러 미리보기는 준비 중입니다.');return false"><span class="card-photo" aria-hidden="true"></span><span class="label"><strong>입술 컬러<br>미리 보기</strong><small>LIP PREVIEW</small></span><span class="arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></span></a></nav><section class="ads" aria-label="광고 배너"><div class="slide active"><strong>화장수리에<br>브랜드를 소개하세요</strong><p>뷰티 전문가를 위한 광고 공간</p><a href="mailto:">광고 입점 문의</a></div><div class="slide"><strong>뷰티 전문가에게<br>제품을 알릴 기회</strong><p>광고 파트너를 모집합니다</p><a href="mailto:">광고 문의 환영</a></div><div class="slide"><strong>이 공간의<br>주인공이 되어보세요</strong><p>화장수리와 함께할 브랜드를 기다립니다</p><a href="mailto:">광고 게재 문의</a></div><div class="dots"><i class="dot on"></i><i class="dot"></i><i class="dot"></i></div></section><section class="forms"><h2>시술 동의서</h2><div class="grid"><div class="item"><span>
